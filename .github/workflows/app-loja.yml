name: App da loja (Flutter)

on:
  pull_request:
    paths: ["app_loja/**", ".github/workflows/app-loja.yml"]
  push:
    branches: [main]
    paths: ["app_loja/**", ".github/workflows/app-loja.yml"]
  workflow_dispatch:

jobs:
  android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app_loja
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: bash preparar.sh
      - run: flutter analyze --no-fatal-infos --no-fatal-warnings
      - run: flutter test
      - name: Gerar APK
        run: flutter build apk --release --dart-define-from-file=../.env.production
      - name: Gerar versão web
        run: flutter build web --release --dart-define-from-file=../.env.production
      - uses: actions/upload-artifact@v4
        with:
          name: loja-mf-apk
          path: app_loja/build/app/outputs/flutter-apk/app-release.apk
      - uses: actions/upload-artifact@v4
        with:
          name: loja-mf-web
          path: app_loja/build/web
