# Publica as Edge Functions no Supabase.
# Rode manualmente em GitHub → Actions → "Publicar Supabase" → Run workflow.
# Secret do repositório necessário (Settings → Secrets and variables → Actions):
#   SUPABASE_ACCESS_TOKEN  (supabase.com → Account → Access Tokens, começa com sbp_)
# O Reference ID do projeto não é segredo (aparece na URL pública do Supabase).
# As mudanças do banco não passam por aqui: são aplicadas no Supabase e guardadas em supabase/migrations
# com o mesmo número que o Supabase registra (veja supabase/MIGRACOES.md).
name: Publicar Supabase

on:
  workflow_dispatch:
    inputs:
      funcoes:
        description: "Publicar só estas funções (nomes separados por espaço). Vazio = todas."
        required: false
        default: ""

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PROJECT_REF: antfofmwrmkadiavjycg  # ELO ERP (São Paulo)
    steps:
      # o ERP em produção sai da paineis-no-ar; a main é uma versão antiga e republicaria funções velhas (aconteceu em 20/10)
      - name: Só pela paineis-no-ar
        if: github.ref_name != 'paineis-no-ar'
        run: |
          echo "::error::Escolha a branch paineis-no-ar em 'Use workflow from' (esta foi ${{ github.ref_name }}). Nada foi publicado."
          exit 1
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: 2.120.0
      - name: Edge Functions
        env:
          SO: ${{ inputs.funcoes }}
        run: |
          # com o campo "funcoes" preenchido, publica só as que estão nele
          quer() { [ -z "$SO" ] || [[ " $SO " == *" $1 "* ]]; }
          for fn in nfe-emitir nfe-consultar nfe-recebidas-sync focus-config usuarios-admin avisos-config produtos-fotos proposta-enviar tiny-importar nfse cotacao-enviar rodonaves; do
            quer "$fn" || continue
            supabase functions deploy "$fn" --project-ref "$PROJECT_REF"
          done
          # chamadas externas (Focus, Telegram, agendamento) não enviam o login do Supabase
          for fn in focus-webhook nfe-processar nfse-processar avisos-enviar telegram-webhook email-descadastrar catalogo-feed email-caixa contador-pacote clientes-receita infinitepay backup-baixar inter openfinance whatsapp mercadolivre; do
            quer "$fn" || continue
            supabase functions deploy "$fn" --project-ref "$PROJECT_REF" --no-verify-jwt
          done
