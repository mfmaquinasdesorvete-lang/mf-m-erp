<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#061226">
<title>Sem internet · ERP Line</title>
<style>
  :root { color-scheme: dark; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #061226; color: #e9ecf2;
    font: 16px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; padding: 24px; box-sizing: border-box; text-align: center; }
  img { width: 72px; height: 72px; border-radius: 18px; }
  h1 { font-size: 22px; margin: 16px 0 6px; }
  p { color: #b8bfcd; margin: 0 auto 20px; max-width: 30ch; }
  button { font: inherit; font-weight: 700; border: 0; border-radius: 14px; padding: 14px 28px; background: #22d3ee; color: #061226; }
</style>
</head>
<body>
  <main>
    <img src="/logo-192.png" alt="">
    <h1>Sem internet agora</h1>
    <p>O ERP Line precisa de internet para mostrar os dados. Confira o Wi-Fi ou os dados móveis e tente de novo.</p>
    <button type="button" onclick="location.reload()">Tentar de novo</button>
  </main>
  <script>addEventListener("online", () => location.reload());</script>
</body>
</html>
