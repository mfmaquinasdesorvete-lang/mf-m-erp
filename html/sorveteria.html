<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sorveteria · PDV e Cardápio Online</title>
<meta name="theme-color" content="#e11d74">
<style>
:root{--bg:#fff7fa;--card:#fff;--fg:#2a1a24;--mut:#7b6573;--line:#f0dbe5;--pri:#e11d74;--pri2:#b80f5a;--ok:#0f9d6b;--warn:#c2410c;--bad:#dc2626;--mint:#d9f7ea;--cream:#fff1c9;--sh:0 1px 2px rgba(80,20,50,.08),0 6px 18px -8px rgba(80,20,50,.18)}
@media(prefers-color-scheme:dark){:root{--bg:#1b1017;--card:#27161f;--fg:#fbeaf2;--mut:#b99aab;--line:#43283a;--mint:#12372b;--cream:#3a3015;--sh:0 1px 2px rgba(0,0,0,.4)}}
*{box-sizing:border-box}html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
button,input,select,textarea{font:inherit;color:inherit}
a{color:inherit}.btn{text-decoration:none}
button{cursor:pointer}
h1,h2,h3{margin:0}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:42px;padding:8px 16px;border-radius:12px;border:1px solid var(--line);background:var(--card);font-weight:700;transition:.15s}
.btn:hover{border-color:var(--pri)}.btn:active{transform:scale(.97)}
.btn.pri{background:var(--pri);border-color:var(--pri);color:#fff}.btn.pri:hover{background:var(--pri2)}
.btn.bad{background:var(--bad);border-color:var(--bad);color:#fff}
.btn.ghost{border-color:transparent;background:transparent}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.sm{min-height:32px;padding:4px 10px;font-size:13px;border-radius:9px}
.btn.lg{min-height:52px;font-size:17px;width:100%}
input,select,textarea{width:100%;min-height:42px;padding:8px 12px;border:1px solid var(--line);border-radius:10px;background:var(--card)}
input:focus,select:focus,button:focus-visible{outline:2px solid var(--pri);outline-offset:1px}
label.f{display:block;font-size:12px;font-weight:700;color:var(--mut)}label.f>*{margin-top:4px;font-weight:400;font-size:15px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;box-shadow:var(--sh)}
.row{display:flex;align-items:center;gap:10px}.sp{flex:1}.wrap{flex-wrap:wrap}.col{display:flex;flex-direction:column;gap:10px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.mut{color:var(--mut)}.sm{font-size:13px}.xs{font-size:12px}.b{font-weight:700}.num{font-variant-numeric:tabular-nums}
.chip{display:inline-block;padding:2px 9px;border-radius:99px;font-size:12px;font-weight:700;background:var(--line)}
.chip.ok{background:var(--mint);color:var(--ok)}.chip.bad{background:#fde2e2;color:var(--bad)}.chip.warn{background:var(--cream);color:var(--warn)}
.tabs{display:flex;gap:6px;overflow-x:auto;padding:2px}.tab{flex:none;padding:8px 14px;border-radius:99px;border:1px solid var(--line);background:var(--card);font-weight:700;font-size:14px}
.tab[aria-pressed=true],.tab[aria-current=page]{background:var(--pri);color:#fff;border-color:var(--pri)}
.badge{display:inline-block;min-width:18px;padding:0 5px;margin-left:4px;border-radius:99px;background:var(--bad);color:#fff;font-size:11px;text-align:center}
/* topo */
.top{position:sticky;top:0;z-index:20;background:var(--card);border-bottom:1px solid var(--line);padding:8px 14px}
.top h1{font-size:17px}
.wrapper{max-width:1280px;margin:0 auto;padding:14px}
/* home */
.hero{min-height:100vh;display:grid;place-items:center;padding:20px;text-align:center}
.hero .opt{display:block;padding:22px;text-align:left;text-decoration:none;color:inherit}
.hero .opt:hover{border-color:var(--pri)}
/* cardápio cliente */
.cl{max-width:640px;margin:0 auto;padding-bottom:96px}
.cl header{background:linear-gradient(135deg,var(--pri),#ff7ab0);color:#fff;padding:22px 16px}
.cl nav{position:sticky;top:0;z-index:10;background:var(--card);border-bottom:1px solid var(--line);padding:10px 12px}
.prod{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:12px;border-radius:16px;border:1px solid var(--line);background:var(--card);box-shadow:var(--sh)}
.prod:disabled{opacity:.45}.prod .em{font-size:32px}
.bar{position:fixed;left:0;right:0;bottom:0;z-index:15;padding:10px 12px calc(10px + env(safe-area-inset-bottom));background:var(--card);border-top:1px solid var(--line)}
/* pdv */
.pdv{display:grid;grid-template-columns:1fr 390px;gap:14px;align-items:start}
@media(max-width:900px){.pdv{grid-template-columns:1fr}}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.tile{min-height:110px;padding:12px;border-radius:16px;border:1px solid var(--line);background:var(--card);text-align:left;display:flex;flex-direction:column;justify-content:space-between;box-shadow:var(--sh)}
.tile:hover{border-color:var(--pri)}.tile:disabled{opacity:.45}.tile .em{font-size:26px}
.cart{position:sticky;top:64px;max-height:calc(100vh - 80px);display:flex;flex-direction:column}
.cart .body{overflow:auto;padding:12px;flex:1}.cart .foot{padding:12px;border-top:1px solid var(--line)}
.seg{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;padding:8px;border-bottom:1px solid var(--line)}
.seg button{padding:8px 0;border-radius:9px;border:0;background:transparent;font-weight:700;font-size:12px}.seg button[aria-pressed=true]{background:var(--pri);color:#fff}
.item{padding:10px 0;border-bottom:1px solid var(--line)}
.qty{display:inline-flex;align-items:center;gap:6px}.qty button{width:30px;height:30px;border-radius:9px;border:1px solid var(--line);background:var(--card);font-weight:700}
.total{font-size:30px;font-weight:800}
.kan{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}@media(max-width:900px){.kan{grid-template-columns:1fr}}
.ord{padding:12px;border-top:4px solid var(--line)}.ord.n{border-top-color:#f59e0b}.ord.p{border-top-color:#0ea5e9}.ord.r{border-top-color:var(--ok)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}.stat{padding:14px}.stat b{font-size:24px;display:block}
.bars{display:flex;align-items:flex-end;gap:3px;height:120px}.bars div{flex:1;background:var(--pri);border-radius:4px 4px 0 0;min-height:2px}
table{width:100%;border-collapse:collapse}td,th{padding:7px 8px;border-bottom:1px solid var(--line);text-align:left;font-size:14px}
/* modal */
#modal:not(:empty){position:fixed;inset:0;z-index:50;background:rgba(30,5,20,.5);display:flex;align-items:flex-start;justify-content:center;overflow:auto;padding:12px}
.mdl{width:100%;max-width:720px;background:var(--card);border-radius:20px;box-shadow:0 20px 60px rgba(0,0,0,.4);margin:auto}.mdl.sm{max-width:480px}
.mdl>header{display:flex;align-items:center;justify-content:space-between;padding:14px 18px;border-bottom:1px solid var(--line)}.mdl>.bd{padding:16px 18px}
.pill{padding:7px 13px;border-radius:99px;border:1px solid var(--line);background:var(--card);font-weight:600}.pill[aria-pressed=true]{background:var(--pri);border-color:var(--pri);color:#fff}.pill:disabled{opacity:.4;text-decoration:line-through}
.sab{display:flex;align-items:center;gap:4px;border:1px solid var(--line);border-radius:12px;padding:4px}.sab.on{border-color:var(--pri);background:rgba(225,29,116,.08)}
.sab>button.n{flex:1;text-align:left;border:0;background:transparent;padding:6px;font-weight:600}
#toast{position:fixed;right:14px;bottom:14px;z-index:99;display:flex;flex-direction:column;gap:8px}
#toast div{padding:10px 16px;border-radius:12px;background:var(--ok);color:#fff;font-weight:600;box-shadow:var(--sh)}#toast div.e{background:var(--bad)}
.steps{display:flex;justify-content:center;gap:10px}
</style>
</head>
<body>
<div id="app"></div><div id="modal"></div><div id="toast" aria-live="polite"></div>
<script>
"use strict";
/* =====================================================================
   Sorveteria · protótipo em HTML único (sem servidor, sem internet)
   - #/            escolha de tela
   - #/cardapio    site do cliente (cardápio online + acompanhar pedido)
   - #/pdv         PDV do caixa (vender, online, produção, caixa, relatório, cardápio)
   Os dois lados conversam pelos dados do navegador (localStorage): abra o cardápio numa
   aba e o PDV em outra do mesmo navegador e faça um pedido de ponta a ponta.
   ===================================================================== */
const KEY = "sorveteria-html-v1";
const $ = (s, r = document) => r.querySelector(s);
const brl = n => Number(n || 0).toLocaleString("pt-BR", { style: "currency", currency: "BRL" });
const r2 = n => Math.round((n + Number.EPSILON) * 100) / 100;
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const uid = () => Math.random().toString(36).slice(2, 9) + Date.now().toString(36).slice(-3);
const num = s => { const v = Number(String(s ?? "").replace(/\./g, "").replace(",", ".")); return Number.isFinite(v) && v > 0 ? v : 0; };
const dig = s => String(s ?? "").replace(/\D/g, "");
const hora = iso => new Date(iso).toLocaleTimeString("pt-BR", { hour: "2-digit", minute: "2-digit" });
const MEIOS = { dinheiro: "Dinheiro", pix: "Pix", credito: "Crédito", debito: "Débito", vale: "Vale-refeição" };
const CANAIS = { balcao: "Balcão", mesa: "Comanda", delivery: "Delivery", retirada: "Retirada" };

/* ---------- dados ---------- */
function seed() {
  const s = (nome, ac = 0) => ({ id: uid(), nome, ac, out: false });
  const c = (nome, preco) => ({ id: uid(), nome, preco, out: false });
  const cob = { id: uid(), nome: "Cobertura", min: 0, max: 1, itens: [c("Chocolate", 0), c("Morango", 0), c("Caramelo", 0), c("Leite condensado", 0), c("Goiabada", 1)] };
  const adi = { id: uid(), nome: "Adicionais", min: 0, max: 6, itens: [c("Granola", 2), c("Leite em pó", 2.5), c("Paçoca", 2), c("Banana", 2), c("Morango", 3.5), c("Confete", 2), c("Chantilly", 2), c("Calda extra", 1.5)] };
  const cas = { id: uid(), nome: "Casquinha", min: 1, max: 1, itens: [c("Simples", 0), c("Crocante", 2), c("Cascão", 3)] };
  const cats = [["Sorvetes", "🍨"], ["Casquinhas", "🍦"], ["Açaí", "🫐"], ["Milkshakes", "🥤"], ["Picolés", "🍡"], ["Bebidas", "🧃"]].map(([nome, em]) => ({ id: uid(), nome, em }));
  const [A, B, C, D, E, F] = cats.map(x => x.id);
  const p = (cat, nome, preco, o = {}) => ({ id: uid(), cat, nome, preco, tipo: "un", sab: 0, grupos: [], ativo: true, out: false, ...o });
  return {
    loja: { nome: "Doce Gelo Sorveteria", whats: "48999990000", comandas: 12, tara: 0, gorjeta: 10, minimo: 0, aberta: true,
      bairros: [{ nome: "Centro", taxa: 5 }, { nome: "Bairro vizinho", taxa: 8 }], prodBalcao: false },
    cats, grupos: [cob, adi, cas],
    sabores: [s("Chocolate"), s("Morango"), s("Creme"), s("Flocos"), s("Napolitano"), s("Doce de leite"), s("Maracujá"), s("Limão"), s("Coco"), s("Abacaxi com hortelã"), s("Brigadeiro"), s("Pistache", 2), s("Ninho com Nutella", 3), s("Cookies", 2)],
    produtos: [
      p(A, "Copo 1 bola", 8, { sab: 1, grupos: [cob.id, adi.id] }), p(A, "Copo 2 bolas", 14, { sab: 2, grupos: [cob.id, adi.id] }),
      p(A, "Copo 3 bolas", 19, { sab: 3, grupos: [cob.id, adi.id] }), p(A, "Sundae", 18, { sab: 2, grupos: [cob.id, adi.id] }),
      p(A, "Self-service (por kg)", 69.9, { tipo: "peso", grupos: [cob.id] }),
      p(B, "Casquinha 1 sabor", 7, { sab: 1, grupos: [cas.id] }), p(B, "Casquinha 2 sabores", 10, { sab: 2, grupos: [cas.id] }),
      p(C, "Açaí 300 ml", 16, { grupos: [adi.id, cob.id] }), p(C, "Açaí 500 ml", 22, { grupos: [adi.id, cob.id] }), p(C, "Açaí 700 ml", 28, { grupos: [adi.id, cob.id] }),
      p(D, "Milkshake 400 ml", 16, { sab: 1, grupos: [cob.id] }), p(D, "Milkshake 500 ml", 19, { sab: 1, grupos: [cob.id] }),
      p(E, "Picolé de fruta", 5), p(E, "Picolé cremoso", 7), p(E, "Picolé de água", 3.5),
      p(F, "Água mineral", 4), p(F, "Refrigerante lata", 6), p(F, "Suco natural", 9)],
    pedidos: [], online: [], caixas: [], seq: 1, ativo: null,
  };
}
let S = load();
function load() { try { const t = localStorage.getItem(KEY); if (t) return JSON.parse(t); } catch {} return seed(); }
function save() { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch {} }
const commit = () => { save(); render(); };

/* ---------- regras de preço (as mesmas valem no pedido online) ---------- */
const prodDe = id => S.produtos.find(p => p.id === id);
const saborDe = id => S.sabores.find(x => x.id === id);
const compDe = id => S.grupos.flatMap(g => g.itens).find(i => i.id === id);
const gruposDe = p => p.grupos.map(id => S.grupos.find(g => g.id === id)).filter(Boolean);
function precoItem(prod, saborIds, compIds, pesoG) {
  const ex = saborIds.reduce((s, id) => s + (saborDe(id)?.ac || 0), 0) + compIds.reduce((s, id) => s + (compDe(id)?.preco || 0), 0);
  return r2((prod.tipo === "peso" ? (pesoG / 1000) * prod.preco : prod.preco) + ex);
}
/** mesma conferência que o banco faria: devolve {erro} ou o item pronto */
function montarItem(prod, saborIds, compIds, qtd, obs) {
  if (prod.out || !prod.ativo) return { erro: `${prod.nome} está em falta` };
  if (saborIds.length !== prod.sab) return { erro: `Escolha ${prod.sab} sabor(es) em ${prod.nome}` };
  for (const id of saborIds) { const s = saborDe(id); if (!s) return { erro: "Sabor inválido" }; if (s.out) return { erro: `O sabor ${s.nome} está em falta` }; }
  const sel = [...new Set(compIds)]; let achados = 0;
  for (const g of gruposDe(prod)) {
    const n = g.itens.filter(i => sel.includes(i.id)); achados += n.length;
    if (n.some(i => i.out)) return { erro: `${n.find(i => i.out).nome} está em falta` };
    if (n.length < g.min) return { erro: `Escolha pelo menos ${g.min} em "${g.nome}"` };
    if (n.length > g.max) return { erro: `No máximo ${g.max} em "${g.nome}"` };
  }
  if (achados !== sel.length) return { erro: "Complemento inválido" };
  return { item: { id: uid(), pid: prod.id, nome: prod.nome, qtd, unit: precoItem(prod, saborIds, sel, 0),
    sabores: saborIds.map(id => saborDe(id).nome), comps: sel.map(id => ({ nome: compDe(id).nome, preco: compDe(id).preco })),
    sIds: saborIds, cIds: sel, obs: (obs || "").trim().slice(0, 80) || undefined } };
}
const itemTotal = i => r2(i.pesoG != null ? i.unit : i.qtd * i.unit);
const subtotal = p => r2(p.itens.reduce((s, i) => s + itemTotal(i), 0));
const descPedido = p => r2(subtotal(p) * Math.min(100, Math.max(0, p.desc || 0)) / 100);
const gorjPedido = p => p.gorjeta ? r2((subtotal(p) - descPedido(p)) * S.loja.gorjeta / 100) : 0;
const totalPedido = p => r2(subtotal(p) - descPedido(p) + (p.canal === "delivery" ? p.taxa || 0 : 0) + gorjPedido(p));
const qtdItens = p => p.itens.reduce((s, i) => s + (i.pesoG != null ? 1 : i.qtd), 0);
const caixaAberto = () => S.caixas.find(c => !c.fechado) || null;

/* ---------- utilidades de interface ---------- */
const A = {}, C = {};              // ações (click) e mudanças (change/input)
document.addEventListener("click", e => { const el = e.target.closest("[data-a]"); if (el && !el.disabled) { const [n, ...a] = el.dataset.a.split(":"); A[n]?.(el, ...a); } });
document.addEventListener("change", e => { const el = e.target.closest("[data-c]"); if (el) C[el.dataset.c]?.(el); });
document.addEventListener("input", e => { const el = e.target.closest("[data-i]"); if (el) C[el.dataset.i]?.(el); });
document.addEventListener("keydown", e => {
  if (e.key === "Escape" && $("#modal").children.length) closeModal();
  if (e.key === "F2" && rota() === "pdv" && ui.tab === "vender" && !$("#modal").children.length) { e.preventDefault(); A.cobrar(); }
  if (e.key === "Enter" && e.target.dataset.enter) { A[e.target.dataset.enter]?.(e.target); }
});
function toast(msg, erro) { const d = document.createElement("div"); d.textContent = msg; if (erro) d.className = "e"; $("#toast").appendChild(d); setTimeout(() => d.remove(), 3800); }
let modalDraw = null;
function openModal(title, draw, small) { modalDraw = { title, draw, small }; drawModal(); }
function drawModal() { if (!modalDraw) return; const m = modalDraw; $("#modal").innerHTML = `<div class="mdl ${m.small ? "sm" : ""}" role="dialog" aria-modal="true" aria-label="${esc(m.title)}"><header><h2 style="font-size:17px">${esc(m.title)}</h2><button class="btn ghost sm" data-a="closeModal" aria-label="Fechar">✕</button></header><div class="bd">${m.draw()}</div></div>`; const f = $("#modal [autofocus]"); if (f) f.focus(); }
function closeModal() { modalDraw = null; $("#modal").innerHTML = ""; }
A.closeModal = closeModal;
function beep() { try { const x = new (window.AudioContext || window.webkitAudioContext)(), o = x.createOscillator(), g = x.createGain(); o.frequency.value = 880; g.gain.value = .12; o.connect(g); g.connect(x.destination); o.start(); o.stop(x.currentTime + .3); o.onended = () => x.close(); } catch {} }
const field = (label, html, cls = "") => `<label class="f ${cls}">${label}${html}</label>`;
const catEm = id => S.cats.find(c => c.id === id)?.em || "🍨";

/* ---------- rotas ---------- */
const rota = () => (location.hash.replace(/^#\/?/, "").split("/")[0] || "");
const ui = { tab: "vender", cat: "", busca: "", sub: "produtos", per: "hoje", mesa: null };   // estado só de tela
const cli = { cat: "", cart: [], canal: "delivery", dados: { nome: "", tel: "", end: "", bairro: "", ref: "", pag: "pix", troco: "", obs: "" }, cod: sessionStorage.getItem("sorv-cod") };
window.addEventListener("hashchange", () => { closeModal(); render(); });
window.addEventListener("storage", e => {
  if (e.key !== KEY) return;
  const antes = S.online.filter(o => o.status === "novo").length;
  S = load();
  if (rota() === "pdv" && S.online.filter(o => o.status === "novo").length > antes) { beep(); toast("Novo pedido online!"); }
  render();
});
function render() {
  const r = rota(); document.title = r === "cardapio" ? `${S.loja.nome} · Cardápio` : r === "pdv" ? `PDV · ${S.loja.nome}` : "Sorveteria · protótipo";
  const y = scrollY; const f = document.activeElement; const foco = f?.dataset?.keep;
  $("#app").innerHTML = r === "cardapio" ? vCardapio() : r === "pdv" ? vPdv() : vHome();
  if (foco) { const n = $(`[data-keep="${foco}"]`); if (n) { n.focus(); try { n.setSelectionRange(n.value.length, n.value.length); } catch {} } }
  scrollTo(0, y); if (modalDraw) drawModal();
}

/* =====================================================================
   HOME
   ===================================================================== */
function vHome() {
  return `<div class="hero"><div style="max-width:520px;width:100%" class="col">
    <div style="font-size:56px">🍨</div><h1 style="font-size:28px">${esc(S.loja.nome)}</h1>
    <p class="mut">Protótipo em HTML: os dois lados conversam entre si. Abra o <b>cardápio</b> numa aba e o <b>PDV</b> em outra, faça um pedido e aceite no caixa.</p>
    <a class="card opt" href="#/cardapio"><b style="font-size:18px">🛍️ Cardápio online</b><br><span class="mut sm">O que o cliente vê no celular: escolhe sabores, entrega ou retirada, acompanha o pedido.</span></a>
    <a class="card opt" href="#/pdv"><b style="font-size:18px">🧾 PDV do caixa</b><br><span class="mut sm">Balcão, comandas, delivery, pedidos online, produção, caixa e relatório.</span></a>
    <button class="btn ghost sm" data-a="zerar">Restaurar dados de exemplo</button></div></div>`;
}
A.zerar = () => { if (confirm("Apagar pedidos, caixas e cardápio e voltar ao exemplo?")) { S = seed(); sessionStorage.removeItem("sorv-cod"); cli.cod = null; cli.cart = []; commit(); } };

/* =====================================================================
   MONTAR ITEM (sabores, complementos, peso) — serve ao PDV e ao cliente
   ===================================================================== */
let M = null; // {prod, sab:{id:n}, comp:{id:1}, qtd, bruto, obs, editId, destino:'pdv'|'cli'}
function abrirMontar(prod, destino, item) {
  M = { prod, destino, sab: {}, comp: {}, qtd: item?.qtd || 1, bruto: item?.pesoG != null ? String(item.pesoG + S.loja.tara) : "", obs: item?.obs || "", editId: item?.id };
  if (item) { (item.sIds || []).forEach(id => M.sab[id] = (M.sab[id] || 0) + 1); (item.cIds || []).forEach(id => M.comp[id] = 1); }
  openModal(prod.nome, drawMontar);
}
const mSabIds = () => Object.entries(M.sab).flatMap(([id, n]) => Array(n).fill(id));
const mCompIds = () => Object.keys(M.comp).filter(k => M.comp[k]);
const mPeso = () => Math.max(0, Math.round(num(M.bruto) - S.loja.tara));
function mErros() {

  ${canal === "delivery" || canal === "retirada" ? `<div class="g2">${field("Telefone", `<input inputmode="tel" data-c="vCli" data-k="tel" value="${esc(d.tel)}">`)}${field("Nome", `<input data-c="vCli" data-k="nome" value="${esc(d.nome)}">`)}</div>${canal === "delivery" ? `${field("Bairro", `<select data-c="vBairro"><option value="">Outro / sem taxa cadastrada</option>${L.bairros.map(b => `<option ${d.bairro === b.nome ? "selected" : ""} value="${esc(b.nome)}">${esc(b.nome)} · ${brl(b.taxa)}</option>`).join("")}</select>`)}${field("Endereço", `<input data-c="vCli" data-k="end" value="${esc(d.end)}">`)}<div class="g2">${field("Referência", `<input data-c="vCli" data-k="ref" value="${esc(d.ref || "")}">`)}${field("Taxa de entrega (R$)", `<input inputmode="decimal" style="text-align:right" data-c="vTaxa" value="${p?.taxa ? String(p.taxa).replace(".", ",") : ""}" placeholder="0">`)}</div>` : ""}` : ""}
  ${itens.length ? itens.map(i => `<div class="item"><div class="row"><b class="sp sm">${esc(i.pesoG != null ? `${i.nome} · ${i.pesoG} g` : i.nome)}${p.enviados.includes(i.id) ? ' <span class="chip xs">ENVIADO</span>' : ""}</b><b class="num sm">${brl(itemTotal(i))}</b></div>${i.sabores.length ? `<div class="mut xs">${esc(i.sabores.join(", "))}</div>` : ""}${i.comps.length ? `<div class="mut xs">+ ${esc(i.comps.map(c => c.nome).join(", "))}</div>` : ""}${i.obs ? `<div class="xs" style="color:var(--warn)">Obs: ${esc(i.obs)}</div>` : ""}
  <div class="row" style="margin-top:4px">${i.pesoG == null ? `<div class="qty"><button aria-label="Menos ${esc(i.nome)}" data-a="vQtd:${i.id}:-1">−</button><b>${i.qtd}</b><button aria-label="Mais ${esc(i.nome)}" data-a="vQtd:${i.id}:1">+</button></div>` : ""}<span class="sp"></span>${i.sIds?.length || i.cIds?.length || i.pesoG != null ? `<button class="btn ghost sm" aria-label="Editar ${esc(i.nome)}" data-a="vEdit:${i.id}">✏️</button>` : ""}<button class="btn ghost sm" aria-label="Remover ${esc(i.nome)}" data-a="vDel:${i.id}">🗑</button></div></div>`).join("") : `<p class="mut" style="text-align:center;padding:28px 8px;border:2px dashed var(--line);border-radius:12px">Toque nos produtos para montar o pedido.</p>`}</div>
  <div class="foot col" style="gap:6px"><div class="num sm"><div class="row"><span class="sp">Subtotal (${p ? qtdItens(p) : 0})</span>${brl(p ? subtotal(p) : 0)}</div>
  <div class="row"><span class="sp">Desconto %</span><input style="width:80px;text-align:right;min-height:34px" inputmode="decimal" placeholder="0" aria-label="Desconto em %" data-c="vDesc" value="${p?.desc ? String(p.desc).replace(".", ",") : ""}"></div>
  ${p && descPedido(p) ? `<div class="row mut xs"><span class="sp">desconto aplicado</span>− ${brl(descPedido(p))}</div>` : ""}${canal === "delivery" && p?.taxa ? `<div class="row"><span class="sp">Taxa de entrega</span>${brl(p.taxa)}</div>` : ""}
  ${canal === "mesa" ? `<div class="row"><label class="sp"><input type="checkbox" style="width:auto;min-height:0" data-c="vGorj" ${p?.gorjeta ? "checked" : ""}> Serviço ${L.gorjeta}%</label>${p?.gorjeta ? brl(gorjPedido(p)) : "—"}</div>` : ""}</div>
  <div class="row"><b class="sp">Total</b><span class="total num">${brl(p ? totalPedido(p) : 0)}</span></div>
  <div class="row">${canal === "mesa" ? `<button class="btn sp" ${novos ? "" : "disabled"} data-a="lancar">Lançar</button>` : ""}<button class="btn pri sp" style="flex:2" ${itens.length ? "" : "disabled"} data-a="cobrar">Cobrar <kbd class="xs" style="opacity:.7">F2</kbd></button></div>
  ${p && !p.numero && itens.length ? `<button class="btn ghost sm" data-a="descartar">Descartar pedido</button>` : ""}</div></aside>`;
}
A.vCanal = (el, k) => { const p = garantir(); p.canal = k; if (k !== "mesa") { p.gorjeta = false; p.mesa = undefined; } if (k !== "delivery") p.taxa = 0; if ((k === "delivery" || k === "retirada") && !p.cliente) p.cliente = { nome: "", tel: "", end: "", bairro: "", ref: "" }; commit(); if (k === "mesa" && !p.mesa) A.vMesa(); };
C.vCli = el => { const p = garantir(); p.cliente = p.cliente || { nome: "", tel: "", end: "", bairro: "", ref: "" }; p.cliente[el.dataset.k] = el.value;
  if (el.dataset.k === "tel" && dig(el.value).length >= 10 && !p.cliente.nome && !p.cliente.end) { const ant = [...S.pedidos, ...S.online.map(o => ({ cliente: { ...o.cliente, tel: o.cliente.tel } }))].reverse().find(x => x.cliente && dig(x.cliente.tel) === dig(el.value) && x.cliente.nome); if (ant) { p.cliente = { ...ant.cliente, tel: el.value }; const b = S.loja.bairros.find(b => b.nome === p.cliente.bairro); if (b && p.canal === "delivery") p.taxa = b.taxa; } }
  commit(); };
C.vBairro = el => { const p = garantir(); p.cliente = p.cliente || {}; p.cliente.bairro = el.value; const b = S.loja.bairros.find(b => b.nome === el.value); if (b) p.taxa = b.taxa; commit(); };
C.vTaxa = el => { garantir().taxa = r2(num(el.value)); commit(); };
C.vDesc = el => { garantir().desc = Math.min(100, num(el.value)); commit(); };
C.vGorj = el => { garantir().gorjeta = el.checked; commit(); };
A.vQtd = (el, id, d) => { const i = ativo().itens.find(x => x.id === id); i.qtd = Math.max(1, i.qtd + Number(d)); commit(); };
A.vDel = (el, id) => { const p = ativo(); p.itens = p.itens.filter(x => x.id !== id); commit(); };
A.vEdit = (el, id) => { const i = ativo().itens.find(x => x.id === id); abrirMontar(prodDe(i.pid), "pdv", i); };
A.descartar = () => { const p = ativo(); if (p.itens.length && !confirm("Descartar este pedido?")) return; S.pedidos = S.pedidos.filter(x => x.id !== p.id); S.ativo = null; commit(); };
A.vMesa = () => openModal("Qual comanda?", () => `<div class="g3" style="grid-template-columns:repeat(auto-fill,minmax(64px,1fr))">${Array.from({ length: S.loja.comandas }, (_, k) => String(k + 1)).map(n => { const oc = S.pedidos.some(p => p.sit === "aberto" && p.canal === "mesa" && p.mesa === n && p.itens.length); return `<button class="btn" style="${oc ? "background:var(--cream);border-color:#d97706" : ""};min-height:56px;font-size:18px" data-a="escMesa:${n}">${n}</button>`; }).join("")}</div><p class="mut xs">Em amarelo: comanda aberta. Escolhê-la soma o carrinho a ela.</p>`, true);
A.escMesa = (el, n) => {
  closeModal(); const p = garantir(), ex = S.pedidos.find(x => x.id !== p.id && x.sit === "aberto" && x.canal === "mesa" && x.mesa === n);
  if (!ex) { p.canal = "mesa"; p.mesa = n; } else { ex.itens.push(...p.itens); S.pedidos = S.pedidos.filter(x => x.id !== p.id); S.ativo = ex.id; }
  commit();
};
function validar(p) {
  if (!p.itens.length) return "Adicione itens ao pedido."; if (!caixaAberto()) return "Abra o caixa para continuar.";
  if (p.canal === "mesa" && !p.mesa) return "Escolha a comanda.";
  if (p.canal === "delivery" && (!p.cliente?.nome?.trim() || !p.cliente?.end?.trim() || !dig(p.cliente?.tel))) return "Delivery: informe nome, telefone e endereço.";
  if (p.canal === "retirada" && !p.cliente?.nome?.trim()) return "Retirada: informe o nome do cliente."; return null;
}
function paraProducao(p) { numerar(p); const novos = p.itens.filter(i => !p.enviados.includes(i.id)); p.enviados = p.itens.map(i => i.id); if (!p.prod || novos.length) { p.prod = "novo"; p.enviadoEm = new Date().toISOString(); } }
A.lancar = () => { const p = ativo(), e = validar(p); if (e) return toast(e, true); paraProducao(p); S.ativo = null; toast(`Comanda ${p.mesa} enviada para a produção.`); commit(); };
A.cobrar = () => { const p = ativo(); if (!p) return; const e = validar(p); if (e) return toast(e, true); abrirCobranca(p.id); };

/* ----- Cobrança ----- */
let P = null; // {id, linhas:[{meio, valor, rec}]}
function abrirCobranca(id) { P = { id, linhas: [] }; openModal("Cobrar pedido", drawCobranca, true); }
function calcPag() {
  const p = S.pedidos.find(x => x.id === P.id), tot = totalPedido(p); let rest = tot; const out = [];
  P.linhas.filter(l => l.meio !== "dinheiro").forEach(l => { const v = Math.min(rest, num(l.valor)); rest = r2(rest - v); out.push({ l, v, rec: v }); });
  P.linhas.filter(l => l.meio === "dinheiro").forEach(l => { const rec = num(l.rec) || num(l.valor), v = Math.min(rest, rec); rest = r2(rest - v); out.push({ l, v, rec }); });
  return { p, tot, rest, out, troco: r2(out.reduce((s, o) => s + (o.l.meio === "dinheiro" ? Math.max(0, o.rec - o.v) : 0), 0)) };
}
function drawCobranca() {
  const { p, tot, rest, out, troco } = calcPag();
  return `<div class="col"><div class="row card" style="padding:12px"><span class="sp mut b">Total a pagar</span><b class="num" style="font-size:30px">${brl(tot)}</b></div>
  <div class="row wrap">${Object.entries(MEIOS).map(([k, r]) => `<button class="btn sp" data-a="pagAdd:${k}">${r}</button>`).join("")}</div>
  ${P.linhas.map((l, i) => `<div class="card" style="padding:10px"><div class="row"><b class="sp">${MEIOS[l.meio]}</b>${l.meio === "dinheiro" ? `<label class="xs mut">Recebido <input style="width:110px;text-align:right;min-height:34px" inputmode="decimal" data-c="pagRec" data-i2="${i}" placeholder="${esc(l.valor)}" value="${esc(l.rec)}" autofocus></label>` : `<input style="width:110px;text-align:right;min-height:34px" inputmode="decimal" aria-label="Valor em ${MEIOS[l.meio]}" data-c="pagVal" data-i2="${i}" value="${esc(l.valor)}">`}<button class="btn ghost sm" aria-label="Remover" data-a="pagDel:${i}">🗑</button></div>
  ${l.meio === "dinheiro" ? `<div class="row wrap" style="margin-top:6px">${[10, 20, 50, 100, 200].map(n => `<button class="pill xs" data-a="pagRapido:${i}:${n}">${brl(n)}</button>`).join("")}<button class="pill xs" data-a="pagRapido:${i}:0">Valor exato</button></div>` : ""}</div>`).join("")}
  ${rest > 0 ? `<div class="row" style="color:var(--warn)"><span class="sp">Falta</span><b class="num">${brl(rest)}</b></div>` : ""}${troco > 0 ? `<div class="row" style="color:var(--ok);font-size:26px;font-weight:800"><span class="sp">Troco</span>${brl(troco)}</div>` : ""}
  <div class="row wrap" style="justify-content:flex-end">${p.canal === "delivery" && !p.naEntrega ? `<button class="btn" data-a="pagEntrega">🛵 Receber na entrega</button>` : ""}<button class="btn pri" style="padding:10px 26px" ${rest > 0 || (!P.linhas.length && tot > 0) ? "disabled" : ""} data-a="pagOk">Confirmar pagamento</button></div></div>`;
}
const linhaDe = el => P.linhas[Number(el.dataset.i2)];
A.pagAdd = (el, meio) => { const { rest } = calcPag(); if (rest <= 0 && meio !== "dinheiro") return; P.linhas.push({ meio, valor: rest > 0 ? rest.toFixed(2).replace(".", ",") : "", rec: "" }); drawModal(); };
C.pagRec = el => { linhaDe(el).rec = el.value.replace(/[^\d,.]/g, ""); drawModal(); }; C.pagVal = el => { linhaDe(el).valor = el.value.replace(/[^\d,.]/g, ""); drawModal(); };
A.pagDel = (el, i) => { P.linhas.splice(Number(i), 1); drawModal(); };
A.pagRapido = (el, i, n) => { P.linhas[Number(i)].rec = Number(n) ? String(n) : ""; drawModal(); };
A.pagEntrega = () => { const p = S.pedidos.find(x => x.id === P.id); if (validar(p)) return toast(validar(p), true); p.naEntrega = true; paraProducao(p); if (S.ativo === p.id) S.ativo = null; closeModal(); toast("Pedido enviado. Cobrar quando entregar."); commit(); };
A.pagOk = () => {
  const { p, rest, out, troco } = calcPag(); if (rest > 0) return;
  numerar(p); p.pags = out.filter(o => o.v > 0).map(o => ({ meio: o.l.meio, valor: o.v })); p.troco = troco; p.sit = "fechado"; p.pagoEm = new Date().toISOString(); p.caixa = caixaAberto()?.id;
  if (p.naEntrega) { p.prod = "entregue"; p.entregueEm = p.pagoEm; } else if (!p.prod && (p.canal !== "balcao" || S.loja.prodBalcao)) paraProducao(p);
  if (S.ativo === p.id) S.ativo = null; closeModal(); commit();
  openModal("Venda concluída", () => `<div class="col" style="text-align:center"><p>Pedido <b>#${p.numero}</b> · ${brl(totalPedido(p))}</p>${troco ? `<div class="card" style="padding:14px;background:var(--mint);color:var(--ok)"><div class="sm b">Troco</div><b class="num" style="font-size:38px">${brl(troco)}</b></div>` : ""}<div class="row" style="justify-content:center"><button class="btn" data-a="imprimir:${p.id}">🖨 Imprimir</button><button class="btn pri" autofocus data-a="closeModal">Novo pedido</button></div></div>`, true);
};

  <div class="num sm mut">Pagamento: ${MEIOS[o.pag]}${o.troco ? ` (troco para ${brl(o.troco)})` : ""} · entrega ${brl(o.taxa)} · <b style="color:var(--fg)">total ${brl(o.total)}</b></div>${o.obs ? `<div class="chip warn" style="margin-top:6px">${esc(o.obs)}</div>` : ""}${o.motivo ? `<div class="xs" style="color:var(--bad)">Motivo: ${esc(o.motivo)}</div>` : ""}
  ${o.status === "novo" ? `<div class="row wrap" style="margin-top:10px"><button class="btn pri" data-a="aceitar:${o.id}">✓ Aceitar e enviar para produção</button><button class="btn" data-a="recusar:${o.id}">✕ Recusar</button><a class="btn" target="_blank" rel="noopener" href="https://wa.me/55${dig(o.cliente.tel)}?text=${encodeURIComponent("Olá, " + o.cliente.nome + "! Sobre o seu pedido " + o.cod + ":")}">💬 WhatsApp</a></div>` : ""}</div>`).join("") : `<p class="mut" style="text-align:center;padding:40px;border:2px dashed var(--line);border-radius:16px">Nenhum pedido online ainda. Faça um pelo cardápio.</p>`}</div>`;
}
A.aceitar = (el, id) => {
  const o = S.online.find(x => x.id === id); if (!o || o.status !== "novo") return;

  const p = { ...novoPedido(o.canal), id: o.id, cliente: { nome: o.cliente.nome, tel: o.cliente.tel, end: o.cliente.end, bairro: o.cliente.bairro, ref: o.cliente.ref }, taxa: o.taxa, itens: o.itens.map(i => ({ ...i })), naEntrega: true,

  S.pedidos.push(p); paraProducao(p); toast(`Pedido online ${o.cod} enviado para a produção.`); commit();
};
A.recusar = (el, id) => openModal("Recusar pedido", () => `<div class="col">${field("Motivo (o cliente vê)", `<input id="motivo" autofocus placeholder="Ex.: sabor acabou, fora da área de entrega">`)}<div class="row" style="justify-content:flex-end"><button class="btn" data-a="closeModal">Voltar</button><button class="btn bad" data-a="recusarOk:${id}">Recusar pedido</button></div></div>`, true);
A.recusarOk = (el, id) => { const m = $("#motivo").value.trim(); if (!m) return toast("Informe o motivo para o cliente.", true); const o = S.online.find(x => x.id === id); o.status = "recusado"; o.motivo = m; closeModal(); commit(); };

/* ----- Produção ----- */
function tProducao() {
  const fila = S.pedidos.filter(p => p.sit !== "cancelado" && p.prod && p.prod !== "entregue");
  const col = (fase, titulo, cls) => { const l = fila.filter(p => p.prod === fase).sort((a, b) => ((a.enviadoEm || a.criado) > (b.enviadoEm || b.criado) ? 1 : -1));
    return `<section><h2 style="font-size:13px;text-transform:uppercase;letter-spacing:.06em" class="mut">${titulo} <span class="chip">${l.length}</span></h2><div class="col" style="margin-top:8px">${l.length ? l.map(p => { const min = Math.floor((Date.now() - new Date(fase === "pronto" ? p.prontoEm : p.enviadoEm || p.criado)) / 6e4);
      return `<div class="card ord ${cls}"><div class="row"><b style="font-size:20px">#${p.numero}</b><span class="chip">${CANAIS[p.canal]}${p.mesa ? " " + esc(p.mesa) : ""}</span><span class="sp"></span><b class="sm" style="color:${min >= 15 && fase !== "pronto" ? "var(--bad)" : "var(--mut)"}">${min} min</b></div>${p.cliente?.nome ? `<div class="mut sm">${esc(p.cliente.nome)}${p.canal === "delivery" && p.cliente.bairro ? " · " + esc(p.cliente.bairro) : ""}</div>` : ""}

  const html = `<!doctype html><meta charset="utf-8"><style>@page{size:80mm auto;margin:0}body{width:72mm;margin:4mm;font:12px/1.35 "Courier New",monospace}.c{text-align:center}.l{display:flex;justify-content:space-between;gap:6px}.f{font-weight:700}.d{padding-left:8px;font-size:11px}hr{border:0;border-top:1px dashed #000;margin:6px 0}</style>
  <div class="c f" style="font-size:15px">${esc(S.loja.nome)}</div><hr><div class="c f">COMPROVANTE · NÃO É DOCUMENTO FISCAL</div><div class="c f" style="font-size:20px">Pedido ${p.numero}</div><div class="c">${CANAIS[p.canal]}${p.mesa ? " " + esc(p.mesa) : ""} · ${new Date(p.criado).toLocaleString("pt-BR")}</div>
  ${p.cliente?.nome ? `<hr><div>Cliente: ${esc(p.cliente.nome)} ${esc(p.cliente.tel || "")}</div>${p.canal === "delivery" ? `<div>${esc(p.cliente.end || "")} ${esc(p.cliente.bairro || "")}</div>` : ""}` : ""}<hr>
  ${p.itens.map(i => l(i.pesoG != null ? `${i.nome} ${i.pesoG}g` : `${i.qtd}x ${i.nome}`, brl(itemTotal(i)), 1) + [i.sabores.join(", "), ...i.comps.map(c => "+ " + c.nome), i.obs && "Obs: " + i.obs].filter(Boolean).map(d => `<div class="d">${esc(d)}</div>`).join("")).join("")}<hr>
  ${descPedido(p) ? l("Desconto", "- " + brl(descPedido(p))) : ""}${p.canal === "delivery" && p.taxa ? l("Taxa de entrega", brl(p.taxa)) : ""}${gorjPedido(p) ? l("Serviço", brl(gorjPedido(p))) : ""}<div class="l f" style="font-size:18px"><span>TOTAL</span><span>${brl(totalPedido(p))}</span></div><hr>
  ${(p.pags || []).map(x => l(MEIOS[x.meio], brl(x.valor))).join("")}${p.troco ? l("Troco", brl(p.troco), 1) : ""}<hr><div class="c">Obrigado e volte sempre!</div>`;
  const q = document.createElement("iframe"); q.style.cssText = "position:fixed;right:0;bottom:0;width:1px;height:1px;border:0;opacity:0"; document.body.appendChild(q);
  q.contentDocument.open(); q.contentDocument.write(html); q.contentDocument.close(); setTimeout(() => { try { q.contentWindow.print(); } finally { setTimeout(() => q.remove(), 6e4); } }, 150);
};
