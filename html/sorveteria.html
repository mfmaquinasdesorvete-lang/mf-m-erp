<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sorveteria · PDV e Cardápio Online</title>
<meta name="theme-color" content="#e11d74">
<style>
:root{--bg:#fff7fa;--card:#fff;--fg:#2a1a24;--mut:#7b6573;--line:#f0dbe5;--pri:#e11d74;--pri2:#b80f5a;--ok:#0f9d6b;--warn:#c2410c;--bad:#dc2626;--mint:#d9f7ea;--cream:#fff1c9;--sh:0 1px 2px rgba(80,20,50,.08),0 6px 18px -8px rgba(80,20,50,.18)}
@media(prefers-color-scheme:dark){:root{--bg:#1b1017;--card:#27161f;--fg:#fbeaf2;--mut:#b99aab;--line:#43283a;--mint:#12372b;--cream:#3a3015;--sh:0 1px 2px rgba(0,0,0,.4)}}
*{box-sizing:border-box}html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
button,input,select,textarea{font:inherit;color:inherit}
a{color:inherit}.btn{text-decoration:none}
button{cursor:pointer}
h1,h2,h3{margin:0}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:42px;padding:8px 16px;border-radius:12px;border:1px solid var(--line);background:var(--card);font-weight:700;transition:.15s}
.btn:hover{border-color:var(--pri)}.btn:active{transform:scale(.97)}
.btn.pri{background:var(--pri);border-color:var(--pri);color:#fff}.btn.pri:hover{background:var(--pri2)}
.btn.bad{background:var(--bad);border-color:var(--bad);color:#fff}
.btn.ghost{border-color:transparent;background:transparent}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.sm{min-height:32px;padding:4px 10px;font-size:13px;border-radius:9px}
.btn.lg{min-height:52px;font-size:17px;width:100%}
input,select,textarea{width:100%;min-height:42px;padding:8px 12px;border:1px solid var(--line);border-radius:10px;background:var(--card)}
input:focus,select:focus,button:focus-visible{outline:2px solid var(--pri);outline-offset:1px}
label.f{display:block;font-size:12px;font-weight:700;color:var(--mut)}label.f>*{margin-top:4px;font-weight:400;font-size:15px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;box-shadow:var(--sh)}
.row{display:flex;align-items:center;gap:10px}.sp{flex:1}.wrap{flex-wrap:wrap}.col{display:flex;flex-direction:column;gap:10px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.mut{color:var(--mut)}.sm{font-size:13px}.xs{font-size:12px}.b{font-weight:700}.num{font-variant-numeric:tabular-nums}
.chip{display:inline-block;padding:2px 9px;border-radius:99px;font-size:12px;font-weight:700;background:var(--line)}
.chip.ok{background:var(--mint);color:var(--ok)}.chip.bad{background:#fde2e2;color:var(--bad)}.chip.warn{background:var(--cream);color:var(--warn)}
.tabs{display:flex;gap:6px;overflow-x:auto;padding:2px}.tab{flex:none;padding:8px 14px;border-radius:99px;border:1px solid var(--line);background:var(--card);font-weight:700;font-size:14px}
.tab[aria-pressed=true],.tab[aria-current=page]{background:var(--pri);color:#fff;border-color:var(--pri)}
.badge{display:inline-block;min-width:18px;padding:0 5px;margin-left:4px;border-radius:99px;background:var(--bad);color:#fff;font-size:11px;text-align:center}
/* topo */
.top{position:sticky;top:0;z-index:20;background:var(--card);border-bottom:1px solid var(--line);padding:8px 14px}
.top h1{font-size:17px}
.wrapper{max-width:1280px;margin:0 auto;padding:14px}
/* home */
.hero{min-height:100vh;display:grid;place-items:center;padding:20px;text-align:center}
.hero .opt{display:block;padding:22px;text-align:left;text-decoration:none;color:inherit}
.hero .opt:hover{border-color:var(--pri)}
/* cardápio cliente */
.cl{max-width:640px;margin:0 auto;padding-bottom:96px}
.cl header{background:linear-gradient(135deg,var(--pri),#ff7ab0);color:#fff;padding:22px 16px}
.cl nav{position:sticky;top:0;z-index:10;background:var(--card);border-bottom:1px solid var(--line);padding:10px 12px}
.prod{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:12px;border-radius:16px;border:1px solid var(--line);background:var(--card);box-shadow:var(--sh)}
.prod:disabled{opacity:.45}.prod .em{font-size:32px}
.bar{position:fixed;left:0;right:0;bottom:0;z-index:15;padding:10px 12px calc(10px + env(safe-area-inset-bottom));background:var(--card);border-top:1px solid var(--line)}
/* pdv */
.pdv{display:grid;grid-template-columns:1fr 390px;gap:14px;align-items:start}
@media(max-width:900px){.pdv{grid-template-columns:1fr}}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.tile{min-height:110px;padding:12px;border-radius:16px;border:1px solid var(--line);background:var(--card);text-align:left;display:flex;flex-direction:column;justify-content:space-between;box-shadow:var(--sh)}
.tile:hover{border-color:var(--pri)}.tile:disabled{opacity:.45}.tile .em{font-size:26px}
.cart{position:sticky;top:64px;max-height:calc(100vh - 80px);display:flex;flex-direction:column}
.cart .body{overflow:auto;padding:12px;flex:1}.cart .foot{padding:12px;border-top:1px solid var(--line)}
.seg{display:grid;grid-template-columns:repeat(5,1fr);gap:4px;padding:8px;border-bottom:1px solid var(--line)}
.seg button{padding:8px 0;border-radius:9px;border:0;background:transparent;font-weight:700;font-size:11px}.seg button[aria-pressed=true]{background:var(--pri);color:#fff}
.item{padding:10px 0;border-bottom:1px solid var(--line)}
.qty{display:inline-flex;align-items:center;gap:6px}.qty button{width:30px;height:30px;border-radius:9px;border:1px solid var(--line);background:var(--card);font-weight:700}
.total{font-size:30px;font-weight:800}
.kan{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}@media(max-width:900px){.kan{grid-template-columns:1fr}}
.ord{padding:12px;border-top:4px solid var(--line)}.ord.n{border-top-color:#f59e0b}.ord.p{border-top-color:#0ea5e9}.ord.r{border-top-color:var(--ok)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}.stat{padding:14px}.stat b{font-size:24px;display:block}
.bars{display:flex;align-items:flex-end;gap:3px;height:120px}.bars div{flex:1;background:var(--pri);border-radius:4px 4px 0 0;min-height:2px}
table{width:100%;border-collapse:collapse}td,th{padding:7px 8px;border-bottom:1px solid var(--line);text-align:left;font-size:14px}
/* modal */
#modal:not(:empty){position:fixed;inset:0;z-index:50;background:rgba(30,5,20,.5);display:flex;align-items:flex-start;justify-content:center;overflow:auto;padding:12px}
.mdl{width:100%;max-width:720px;background:var(--card);border-radius:20px;box-shadow:0 20px 60px rgba(0,0,0,.4);margin:auto}.mdl.sm{max-width:480px}
.mdl>header{display:flex;align-items:center;justify-content:space-between;padding:14px 18px;border-bottom:1px solid var(--line)}.mdl>.bd{padding:16px 18px}
.pill{padding:7px 13px;border-radius:99px;border:1px solid var(--line);background:var(--card);font-weight:600}.pill[aria-pressed=true]{background:var(--pri);border-color:var(--pri);color:#fff}.pill:disabled{opacity:.4;text-decoration:line-through}
.sab{display:flex;align-items:center;gap:4px;border:1px solid var(--line);border-radius:12px;padding:4px}.sab.on{border-color:var(--pri);background:rgba(225,29,116,.08)}
.sab>button.n{flex:1;text-align:left;border:0;background:transparent;padding:6px;font-weight:600}
.tv{min-height:100vh;background:#12060d;color:#fff;padding:24px}.tv h2{font-size:28px;letter-spacing:.08em;text-transform:uppercase;margin-bottom:16px}.tv .senha{display:inline-block;margin:6px;padding:10px 24px;border-radius:18px;font-size:54px;font-weight:800;background:#3a1a2b}.tv .pronto .senha{background:var(--ok);animation:pisca 1.2s infinite}@keyframes pisca{50%{opacity:.55}}
.big{min-height:76px;font-size:20px}.tot{max-width:900px;margin:0 auto;padding:16px 16px 120px}
.mut2{opacity:.7}.warnbg{background:var(--cream)}
#toast{position:fixed;right:14px;bottom:14px;z-index:99;display:flex;flex-direction:column;gap:8px}
#toast div{padding:10px 16px;border-radius:12px;background:var(--ok);color:#fff;font-weight:600;box-shadow:var(--sh)}#toast div.e{background:var(--bad)}
.steps{display:flex;justify-content:center;gap:10px}
</style>
</head>
<body>
<div id="app"></div><div id="modal"></div><div id="toast" aria-live="polite"></div>
<script>
"use strict";
/* =====================================================================
   Sorveteria · protótipo em HTML único (sem servidor, sem internet)
   - #/            escolha de tela
   - #/cardapio    site do cliente (cardápio online + acompanhar pedido)
   - #/pdv         PDV do caixa (vender, online, produção, caixa, relatório, cardápio)
   Os dois lados conversam pelos dados do navegador (localStorage): abra o cardápio numa
   aba e o PDV em outra do mesmo navegador e faça um pedido de ponta a ponta.
   ===================================================================== */
const KEY = "sorveteria-html-v1";
const $ = (s, r = document) => r.querySelector(s);
const brl = n => Number(n || 0).toLocaleString("pt-BR", { style: "currency", currency: "BRL" });
const r2 = n => Math.round((n + Number.EPSILON) * 100) / 100;
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const uid = () => Math.random().toString(36).slice(2, 9) + Date.now().toString(36).slice(-3);
const num = s => { const v = Number(String(s ?? "").replace(/\./g, "").replace(",", ".")); return Number.isFinite(v) && v > 0 ? v : 0; };
const dig = s => String(s ?? "").replace(/\D/g, "");
const hora = iso => new Date(iso).toLocaleTimeString("pt-BR", { hour: "2-digit", minute: "2-digit" });
const MEIOS = { dinheiro: "Dinheiro", pix: "Pix", credito: "Crédito", debito: "Débito", vale: "Vale-refeição", app: "Pago no app" };
const MEIOS_PAG = Object.entries(MEIOS).filter(([k]) => k !== "app");
const CANAIS = { balcao: "Balcão", mesa: "Comanda", delivery: "Delivery", retirada: "Retirada", mkt: "iFood/App" };
const hojeISO = () => new Date().toISOString().slice(0, 10);
const dataBR = d => d ? new Date(d + "T12:00:00").toLocaleDateString("pt-BR") : "—";

/* ---------- dados ---------- */
function seed() {
  const s = (nome, ac = 0) => ({ id: uid(), nome, ac, out: false });
  const c = (nome, preco) => ({ id: uid(), nome, preco, out: false });
  const cob = { id: uid(), nome: "Cobertura", min: 0, max: 1, itens: [c("Chocolate", 0), c("Morango", 0), c("Caramelo", 0), c("Leite condensado", 0), c("Goiabada", 1)] };
  const adi = { id: uid(), nome: "Adicionais", min: 0, max: 6, itens: [c("Granola", 2), c("Leite em pó", 2.5), c("Paçoca", 2), c("Banana", 2), c("Morango", 3.5), c("Confete", 2), c("Chantilly", 2), c("Calda extra", 1.5)] };
  const cas = { id: uid(), nome: "Casquinha", min: 1, max: 1, itens: [c("Simples", 0), c("Crocante", 2), c("Cascão", 3)] };
  const cats = [["Sorvetes", "🍨"], ["Casquinhas", "🍦"], ["Açaí", "🫐"], ["Milkshakes", "🥤"], ["Picolés", "🍡"], ["Bebidas", "🧃"]].map(([nome, em]) => ({ id: uid(), nome, em }));
  const [A, B, C, D, E, F] = cats.map(x => x.id);
  const p = (cat, nome, preco, o = {}) => ({ id: uid(), cat, nome, preco, tipo: "un", sab: 0, grupos: [], ativo: true, out: false, ...o });
  return {
    loja: { nome: "Doce Gelo Sorveteria", whats: "48999990000", comandas: 12, tara: 0, gorjeta: 10, minimo: 0, aberta: true, comMkt: 12, fid: { ativo: true, pts: 1, resgatePts: 100, resgateR: 10 },
      bairros: [{ nome: "Centro", taxa: 5 }, { nome: "Bairro vizinho", taxa: 8 }], prodBalcao: false },
    cats, grupos: [cob, adi, cas],
    sabores: [s("Chocolate"), s("Morango"), s("Creme"), s("Flocos"), s("Napolitano"), s("Doce de leite"), s("Maracujá"), s("Limão"), s("Coco"), s("Abacaxi com hortelã"), s("Brigadeiro"), s("Pistache", 2), s("Ninho com Nutella", 3), s("Cookies", 2)],
    produtos: [
      p(A, "Copo 1 bola", 8, { sab: 1, grupos: [cob.id, adi.id] }), p(A, "Copo 2 bolas", 14, { sab: 2, grupos: [cob.id, adi.id] }),
      p(A, "Copo 3 bolas", 19, { sab: 3, grupos: [cob.id, adi.id] }), p(A, "Sundae", 18, { sab: 2, grupos: [cob.id, adi.id] }),
      p(A, "Self-service (por kg)", 69.9, { tipo: "peso", grupos: [cob.id] }),
      p(B, "Casquinha 1 sabor", 7, { sab: 1, grupos: [cas.id] }), p(B, "Casquinha 2 sabores", 10, { sab: 2, grupos: [cas.id] }),
      p(C, "Açaí 300 ml", 16, { grupos: [adi.id, cob.id] }), p(C, "Açaí 500 ml", 22, { grupos: [adi.id, cob.id] }), p(C, "Açaí 700 ml", 28, { grupos: [adi.id, cob.id] }),
      p(D, "Milkshake 400 ml", 16, { sab: 1, grupos: [cob.id] }), p(D, "Milkshake 500 ml", 19, { sab: 1, grupos: [cob.id] }),
      p(E, "Picolé de fruta", 5), p(E, "Picolé cremoso", 7), p(E, "Picolé de água", 3.5),
      p(F, "Água mineral", 4), p(F, "Refrigerante lata", 6), p(F, "Suco natural", 9)],
    pedidos: [], online: [], caixas: [], seq: 1, ativo: null,
    entregadores: [{ id: uid(), nome: "Carlos Moto", tel: "48988880000", repasse: 4, ativo: true }], clientes: [], cupons: [{ id: uid(), cod: "BEMVINDO10", tipo: "%", valor: 10, min: 15, validade: "", limite: 0, usos: 0, ativo: true }],
    contas: [], movEst: [], insumos: [], receitas: {},
  };
}
let S = load();
function load() {
  let d = null; try { const t = localStorage.getItem(KEY); if (t) d = JSON.parse(t); } catch {}
  if (!d) { d = seed(); seedEstoque(d); return d; }
  const base = seed(); const r = { ...base, ...d, loja: { ...base.loja, ...d.loja, fid: { ...base.loja.fid, ...(d.loja?.fid || {}) } } };
  if (!d.insumos?.length) seedEstoque(r);
  r.pedidos = r.pedidos.filter(p => !(p.sit === "aberto" && !p.numero && !p.itens.length && Date.now() - new Date(p.criado) > 72e5)); // rascunhos vazios esquecidos
  return r;
}
/** insumos e fichas técnicas de exemplo (ligados aos produtos pelo nome) */
function seedEstoque(d) {
  const ins = (nome, un, estoque, min, custo) => ({ id: uid(), nome, un, estoque, min, custo });
  const base = ins("Base de sorvete", "g", 20000, 5000, 0.012), leite = ins("Leite", "ml", 15000, 4000, 0.0045), polpa = ins("Polpa de açaí", "g", 12000, 3000, 0.025),
    calda = ins("Caldas e coberturas", "ml", 4000, 800, 0.015), gran = ins("Granola", "g", 3000, 500, 0.02), fruta = ins("Frutas e adicionais", "g", 4000, 800, 0.03),
    cas = ins("Casquinha", "un", 200, 50, 0.45), copo = ins("Copo / pote", "un", 400, 100, 0.25), emb = ins("Embalagem delivery", "un", 300, 60, 0.6), beb = ins("Bebidas prontas", "un", 60, 24, 3.2), pic = ins("Picolés", "un", 120, 40, 2.1);
  d.insumos = [base, leite, polpa, calda, gran, fruta, cas, copo, emb, beb, pic]; d.receitas = {};
  const L = (i, q) => ({ i: i.id, q });
  for (const p of d.produtos) {
    const n = p.nome; let l = [];
    if (/^Copo|Sundae/.test(n)) l = [L(copo, 1)]; else if (/^Casquinha/.test(n)) l = [L(cas, 1)];
    else if (/^Açaí (\d+)/.test(n)) l = [L(polpa, Number(n.match(/(\d+)/)[1])), L(copo, 1)]; else if (/^Milkshake (\d+)/.test(n)) l = [L(leite, Number(n.match(/(\d+)/)[1]) * .6), L(copo, 1)];
    else if (/^Picolé/.test(n)) l = [L(pic, 1)]; else if (/Água|Refri|Suco/.test(n)) l = [L(beb, 1)]; else if (p.tipo === "peso") l = [L(base, 1), L(copo, 1 / 350)];
    if (l.length) d.receitas["p:" + p.id] = l;
  }
  for (const s of d.sabores) d.receitas["s:" + s.id] = [L(base, 90)];
  for (const g of d.grupos) for (const i of g.itens) d.receitas["c:" + i.id] = g.nome === "Cobertura" ? [L(calda, 20)] : i.nome === "Granola" ? [L(gran, 30)] : g.nome === "Adicionais" ? [L(fruta, 30)] : [];
  d.receitas.canal = [L(emb, 1)];
}
function save() { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch {} }
const commit = () => { save(); render(); };

/* ---------- regras de preço (as mesmas valem no pedido online) ---------- */
const prodDe = id => S.produtos.find(p => p.id === id);
const saborDe = id => S.sabores.find(x => x.id === id);
const compDe = id => S.grupos.flatMap(g => g.itens).find(i => i.id === id);
const gruposDe = p => p.grupos.map(id => S.grupos.find(g => g.id === id)).filter(Boolean);
function precoItem(prod, saborIds, compIds, pesoG) {
  const ex = saborIds.reduce((s, id) => s + (saborDe(id)?.ac || 0), 0) + compIds.reduce((s, id) => s + (compDe(id)?.preco || 0), 0);
  return r2((prod.tipo === "peso" ? (pesoG / 1000) * prod.preco : prod.preco) + ex);
}
/** mesma conferência que o banco faria: devolve {erro} ou o item pronto */
function montarItem(prod, saborIds, compIds, qtd, obs) {
  if (prod.out || !prod.ativo) return { erro: `${prod.nome} está em falta` };
  if (saborIds.length !== prod.sab) return { erro: `Escolha ${prod.sab} sabor(es) em ${prod.nome}` };
  for (const id of saborIds) { const s = saborDe(id); if (!s) return { erro: "Sabor inválido" }; if (s.out) return { erro: `O sabor ${s.nome} está em falta` }; }
  const sel = [...new Set(compIds)]; let achados = 0;
  for (const g of gruposDe(prod)) {
    const n = g.itens.filter(i => sel.includes(i.id)); achados += n.length;
    if (n.some(i => i.out)) return { erro: `${n.find(i => i.out).nome} está em falta` };
    if (n.length < g.min) return { erro: `Escolha pelo menos ${g.min} em "${g.nome}"` };
    if (n.length > g.max) return { erro: `No máximo ${g.max} em "${g.nome}"` };
  }
  if (achados !== sel.length) return { erro: "Complemento inválido" };
  return { item: { id: uid(), pid: prod.id, nome: prod.nome, qtd, unit: precoItem(prod, saborIds, sel, 0),
    sabores: saborIds.map(id => saborDe(id).nome), comps: sel.map(id => ({ nome: compDe(id).nome, preco: compDe(id).preco })),
    sIds: saborIds, cIds: sel, obs: (obs || "").trim().slice(0, 80) || undefined } };
}
const itemTotal = i => r2(i.pesoG != null ? i.unit : i.qtd * i.unit);
const subtotal = p => r2(p.itens.reduce((s, i) => s + itemTotal(i), 0));
const cupomDe = cod => S.cupons.find(c => c.cod === String(cod || "").toUpperCase());
const cupomValor = p => { const c = p.cupom && cupomDe(p.cupom); if (!c || !c.ativo) return 0; const s = subtotal(p); return r2(c.tipo === "%" ? s * c.valor / 100 : c.valor); };
const resgateValor = p => p.resgate ? S.loja.fid.resgateR : 0;
const descPedido = p => r2(Math.min(subtotal(p), subtotal(p) * Math.min(100, Math.max(0, p.desc || 0)) / 100 + cupomValor(p) + resgateValor(p)));
const gorjPedido = p => p.gorjeta ? r2((subtotal(p) - descPedido(p)) * S.loja.gorjeta / 100) : 0;
const totalPedido = p => r2(subtotal(p) - descPedido(p) + (p.canal === "delivery" ? p.taxa || 0 : 0) + gorjPedido(p));
const qtdItens = p => p.itens.reduce((s, i) => s + (i.pesoG != null ? 1 : i.qtd), 0);
const caixaAberto = () => S.caixas.find(c => !c.fechado) || null;

/* ---------- utilidades de interface ---------- */
const A = {}, C = {};              // ações (click) e mudanças (change/input)
/* Ao sair de um campo (change) a tela é redesenhada; se o clique num botão começou antes disso, o botão antigo some e o clique se perderia.
   Por isso guardamos o botão no "pointerdown" e executamos a ação mesmo se ele foi substituído. */
let pend = null;
const rodar = (txt, el) => { descarregar(); const [n, ...a] = txt.split(":"); A[n]?.(el, ...a); };
document.addEventListener("pointerdown", e => { const el = e.target.closest("[data-a]"); pend = el && !el.disabled ? { a: el.dataset.a, t: Date.now() } : null; }, true);
document.addEventListener("click", e => {
  const el = e.target.closest("[data-a]");
  if (el && !el.disabled) { pend = null; return rodar(el.dataset.a, el); }
  if (!el && pend && Date.now() - pend.t < 2000) { const a = pend.a; pend = null; rodar(a, null); }
});
// o "change" espera o foco assentar: redesenhar no meio da troca de campo perderia o campo que a pessoa acabou de clicar
const fila = new Set();   // mudanças de campo esperando o foco assentar; qualquer ação as grava antes de rodar
const descarregar = () => [...fila].forEach(f => f());
document.addEventListener("change", e => { const el = e.target.closest("[data-c]"); if (!el) return; const f = () => { clearTimeout(t); fila.delete(f); C[el.dataset.c]?.(el); }; const t = setTimeout(f, 0); fila.add(f); });
document.addEventListener("input", e => { const el = e.target.closest("[data-i]"); if (el) C[el.dataset.i]?.(el); });
document.addEventListener("keydown", e => {
  if (e.key === "Escape" && $("#modal").children.length) closeModal();
  if (e.key === "F2" && rota() === "pdv" && ui.tab === "vender" && !$("#modal").children.length) { e.preventDefault(); descarregar(); A.cobrar(); }
  if (e.key === "Enter" && e.target.dataset.enter) { A[e.target.dataset.enter]?.(e.target); }
});
function toast(msg, erro) { const d = document.createElement("div"); d.textContent = msg; if (erro) d.className = "e"; $("#toast").appendChild(d); setTimeout(() => d.remove(), 3800); }
/** redesenha mantendo o campo focado (e o cursor), para digitar sem perder o foco */
const keyOf = el => !el || !el.matches?.("input,select,textarea") ? null : el.id ? "#" + el.id : el.dataset.keep ? "k:" + el.dataset.keep : (el.dataset.c || el.dataset.i) ? [el.dataset.c || el.dataset.i, el.dataset.k, el.dataset.i2, el.dataset.id].join("|") : null;
function comFoco(fn) {
  const f = document.activeElement, k = keyOf(f), a = f?.selectionStart, b = f?.selectionEnd;
  // o que já foi digitado e ainda não virou dado (campo sem "input" ligado ao estado) não pode sumir no redesenho
  const sujos = [...document.querySelectorAll("input:not([type=checkbox]):not([data-i])")].filter(n => n.value !== n.defaultValue && keyOf(n)).map(n => [keyOf(n), n.value]);
  fn(); sujos.forEach(([kk, v]) => { for (const n of document.querySelectorAll("input")) if (keyOf(n) === kk) { n.value = v; break; } });
  if (!k) return false;
  for (const n of document.querySelectorAll("input,select,textarea")) if (keyOf(n) === k) { n.focus(); try { n.setSelectionRange(a, b); } catch {} return true; }
  return false;
}
let modalDraw = null;
function openModal(title, draw, small) { modalDraw = { title, draw, small }; drawModal(); }
function drawModal() { if (!modalDraw) return; const m = modalDraw; let ok = comFoco(() => { $("#modal").innerHTML = `<div class="mdl ${m.small ? "sm" : ""}" role="dialog" aria-modal="true" aria-label="${esc(m.title)}"><header><h2 style="font-size:17px">${esc(m.title)}</h2><button class="btn ghost sm" data-a="closeModal" aria-label="Fechar">✕</button></header><div class="bd">${m.draw()}</div></div>`; }); if (!ok) { const f = $("#modal [autofocus]"); if (f) f.focus(); } }
function closeModal() { modalDraw = null; $("#modal").innerHTML = ""; }
A.closeModal = closeModal;
function beep() { try { const x = new (window.AudioContext || window.webkitAudioContext)(), o = x.createOscillator(), g = x.createGain(); o.frequency.value = 880; g.gain.value = .12; o.connect(g); g.connect(x.destination); o.start(); o.stop(x.currentTime + .3); o.onended = () => x.close(); } catch {} }

/* =====================================================================
   MONTAR ITEM (sabores, complementos, peso) — serve ao PDV e ao cliente
   ===================================================================== */
let M = null; // {prod, sab:{id:n}, comp:{id:1}, qtd, bruto, obs, editId, destino:'pdv'|'cli'}
function abrirMontar(prod, destino, item) {
  M = { prod, destino, sab: {}, comp: {}, qtd: item?.qtd || 1, bruto: item?.pesoG != null ? String(item.pesoG + S.loja.tara) : "", obs: item?.obs || "", editId: item?.id };
  if (item) { (item.sIds || []).forEach(id => M.sab[id] = (M.sab[id] || 0) + 1); (item.cIds || []).forEach(id => M.comp[id] = 1); }
  openModal(prod.nome, drawMontar);
}
const mSabIds = () => Object.entries(M.sab).flatMap(([id, n]) => Array(n).fill(id));
const mCompIds = () => Object.keys(M.comp).filter(k => M.comp[k]);
const mPeso = () => Math.max(0, Math.round(num(M.bruto) - S.loja.tara));
function mErros() {
  const e = [], n = mSabIds().length;
  if (M.prod.sab > 0 && n !== M.prod.sab) e.push(`Escolha ${M.prod.sab} ${M.prod.sab === 1 ? "sabor" : "sabores"} (${n}/${M.prod.sab})`);
  for (const g of gruposDe(M.prod)) { const k = g.itens.filter(i => M.comp[i.id]).length; if (k < g.min) e.push(`${g.nome}: escolha pelo menos ${g.min}`); }
  if (M.prod.tipo === "peso" && mPeso() <= 0) e.push("Informe o peso da balança");
  return e;
}
function drawMontar() {
  const p = M.prod, n = mSabIds().length, unit = precoItem(p, mSabIds(), mCompIds(), mPeso()), erros = mErros();
  const tot = r2(unit * (p.tipo === "peso" ? 1 : M.qtd));
  return `<div class="col" style="gap:18px">
  ${p.tipo === "peso" ? `<section><h3 style="font-size:15px">Peso na balança</h3><div class="row wrap" style="margin-top:8px"><input style="width:150px;text-align:right;font-size:20px;font-weight:700" inputmode="decimal" autofocus data-i="mBruto" data-keep="bruto" value="${esc(M.bruto)}" placeholder="0" aria-label="Peso em gramas"> <span class="mut">gramas</span>${S.loja.tara ? `<span class="mut sm">− pote ${S.loja.tara} g = <b>${mPeso()} g</b></span>` : ""}</div><div class="mut xs" style="margin-top:4px">${brl(p.preco)} por kg${mPeso() ? ` · ${brl(r2(mPeso() / 1000 * p.preco))} de sorvete` : ""}</div></section>` : ""}
  ${p.sab > 0 ? `<section><h3 style="font-size:15px">Sabores <span class="mut" style="font-weight:400">(${n}/${p.sab})</span></h3><div class="g3" style="margin-top:8px">${S.sabores.map(s => { const q = M.sab[s.id] || 0; return `<div class="sab ${q ? "on" : ""}" style="${s.out ? "opacity:.4" : ""}"><button class="n" ${s.out ? "disabled" : ""} data-a="mSab:${s.id}:1">${esc(s.nome)}${s.ac ? `<div class="mut xs" style="font-weight:400">+ ${brl(s.ac)}</div>` : ""}${s.out ? `<div class="xs" style="color:var(--bad);font-weight:400">em falta</div>` : ""}</button>${q ? `<button class="btn ghost sm" aria-label="Menos ${esc(s.nome)}" data-a="mSab:${s.id}:-1">−</button><b>${q}</b>` : ""}</div>`; }).join("")}</div></section>` : ""}
  ${gruposDe(p).map(g => `<section><h3 style="font-size:15px">${esc(g.nome)} <span class="mut" style="font-weight:400">${g.min ? "obrigatório · " : ""}${g.max === 1 ? "escolha 1" : `até ${g.max}`}</span></h3><div class="row wrap" style="margin-top:8px">${g.itens.map(i => `<button class="pill" aria-pressed="${!!M.comp[i.id]}" ${i.out ? "disabled" : ""} data-a="mComp:${g.id}:${i.id}">${esc(i.nome)}${i.preco ? ` <span style="opacity:.75;font-weight:400">+ ${brl(i.preco)}</span>` : ""}</button>`).join("")}</div></section>`).join("")}
  ${field("Observação (ex.: sem canudo)", `<input maxlength="80" data-i="mObs" data-keep="mobs" value="${esc(M.obs)}">`)}
  <div class="row wrap" style="border-top:1px solid var(--line);padding-top:14px">
    ${p.tipo !== "peso" ? `<div class="qty"><button aria-label="Diminuir" data-a="mQtd:-1">−</button><b style="min-width:26px;text-align:center;font-size:18px">${M.qtd}</b><button aria-label="Aumentar" data-a="mQtd:1">+</button></div>` : ""}
    <div class="sp"><span class="mut sm">Total</span> <b class="num" style="font-size:22px">${brl(tot)}</b>${erros.length ? `<div class="xs" style="color:var(--warn)">${erros.join(" · ")}</div>` : ""}</div>
    <button class="btn pri" ${erros.length ? "disabled" : ""} data-a="mOk">${M.editId ? "Salvar item" : "Adicionar"}</button></div></div>`;
}
C.mBruto = el => { M.bruto = el.value.replace(/[^\d,.]/g, ""); drawModal(); };
C.mObs = el => { M.obs = el.value; };
A.mSab = (el, id, d) => { d = Number(d); const n = mSabIds().length; if (d > 0 && n >= M.prod.sab) return; M.sab[id] = Math.max(0, (M.sab[id] || 0) + d); if (!M.sab[id]) delete M.sab[id]; drawModal(); };
A.mComp = (el, gid, id) => { const g = S.grupos.find(x => x.id === gid); if (M.comp[id]) delete M.comp[id]; else { const usados = g.itens.filter(i => M.comp[i.id]).length; if (usados >= g.max) { if (g.max === 1) g.itens.forEach(i => delete M.comp[i.id]); else return; } M.comp[id] = 1; } drawModal(); };
A.mQtd = (el, d) => { M.qtd = Math.max(1, M.qtd + Number(d)); drawModal(); };
A.mOk = () => {
  if (mErros().length) return;
  const p = M.prod, r = montarItem(p.tipo === "peso" ? { ...p, sab: 0 } : p, p.tipo === "peso" ? [] : mSabIds(), mCompIds(), M.qtd, M.obs);
  if (r.erro) return toast(r.erro, true);
  const it = r.item; if (M.editId) it.id = M.editId;
  if (p.tipo === "peso") { it.pesoG = mPeso(); it.qtd = 1; it.unit = precoItem(p, [], mCompIds(), it.pesoG); }
  const destino = M.destino; closeModal(); M = null;
  if (destino === "tot") { tot.cart.push(it); render(); }
  else if (destino === "cli") { cli.cart = cli.cart.some(x => x.id === it.id) ? cli.cart.map(x => x.id === it.id ? it : x) : [...cli.cart, it]; render(); }
  else addItemPdv(it);
};

  ${q ? `<div class="bar"><button class="btn pri lg" data-a="cCarrinho">🛍️ Ver pedido · ${q} ${q === 1 ? "item" : "itens"} · ${brl(sub)}</button></div>` : ""}</div>`;

A.cCat = (el, id) => { cli.cat = id; render(); };
A.cProd = (el, id) => {
  const p = prodDe(id); if (!S.loja.aberta) return toast("A loja está fechada no momento.", true);

function cTaxa() { return cli.canal === "delivery" ? (S.loja.bairros.find(b => b.nome === cli.dados.bairro)?.taxa ?? 0) : 0; }
A.cCarrinho = () => openModal("Seu pedido", drawCheckout);
function drawCheckout() {
  const d = cli.dados, L = S.loja, sub = r2(cli.cart.reduce((s, i) => s + itemTotal(i), 0)), taxa = cTaxa(), falta = L.minimo - sub, cv = d.cupom ? cupomValida(d.cupom, sub) : null, dsc = cv?.c ? r2(cv.c.tipo === "%" ? sub * cv.c.valor / 100 : cv.c.valor) : 0;
  if (!cli.cart.length) return `<p class="mut">Seu pedido está vazio.</p>`;

  <div class="g2" role="group" aria-label="Como receber">${[["delivery", "Entrega"], ["retirada", "Retirar na loja"]].map(([k, r]) => `<button class="tab" style="text-align:center" aria-pressed="${cli.canal === k}" data-a="cCanal:${k}">${r}</button>`).join("")}</div>

  ${cli.canal === "delivery" ? `${L.bairros.length ? field("Bairro", `<select data-c="cDado" data-k="bairro"><option value="">Escolha o bairro</option>${L.bairros.map(b => `<option value="${esc(b.nome)}" ${d.bairro === b.nome ? "selected" : ""}>${esc(b.nome)} · entrega ${brl(b.taxa)}</option>`).join("")}</select>`) : ""}${field("Endereço (rua e número)", `<input data-c="cDado" data-k="end" autocomplete="street-address" value="${esc(d.end)}">`)}${field("Complemento / referência", `<input data-c="cDado" data-k="ref" value="${esc(d.ref)}">`)}` : ""}
  ${field(cli.canal === "delivery" ? "Pagar na entrega com" : "Pagar na retirada com", `<select data-c="cDado" data-k="pag">${MEIOS_PAG.map(([k, r]) => `<option value="${k}" ${d.pag === k ? "selected" : ""}>${r}</option>`).join("")}</select>`)}
  ${d.pag === "dinheiro" ? field("Troco para quanto? (opcional)", `<input data-c="cDado" data-k="troco" inputmode="decimal" placeholder="Ex.: 50" value="${esc(d.troco)}">`) : ""}
  ${field("Alguma observação?", `<input maxlength="200" data-c="cDado" data-k="obs" value="${esc(d.obs)}">`)}
  ${S.cupons.some(c => c.ativo) ? field("Cupom de desconto", `<input data-c="cDado" data-k="cupom" style="text-transform:uppercase" value="${esc(d.cupom)}">`) : ""}
  <div style="border-top:1px solid var(--line);padding-top:10px" class="num"><div class="row"><span class="sp">Itens</span>${brl(sub)}</div>${cli.canal === "delivery" ? `<div class="row"><span class="sp">Entrega</span>${d.bairro || !L.bairros.length ? brl(taxa) : "escolha o bairro"}</div>` : ""}${d.cupom ? `<div class="row" style="color:${cv?.c ? "var(--ok)" : "var(--bad)"}"><span class="sp">${cv?.c ? "Cupom " + esc(d.cupom.toUpperCase()) : esc(cv?.erro || "")}</span>${cv?.c ? "− " + brl(dsc) : ""}</div>` : ""}<div class="row" style="font-size:22px;font-weight:800"><span class="sp">Total</span>${brl(Math.max(0, sub - dsc) + taxa)}</div></div>

C.cDado = el => { cli.dados[el.dataset.k] = el.value; if (["bairro", "pag"].includes(el.dataset.k)) drawModal(); };
A.cCanal = (el, k) => { cli.canal = k; drawModal(); };
A.cQtd = (el, id, d) => { const i = cli.cart.find(x => x.id === id); i.qtd = Math.max(1, i.qtd + Number(d)); drawModal(); render(); };
A.cDel = (el, id) => { cli.cart = cli.cart.filter(x => x.id !== id); if (!cli.cart.length) closeModal(); else drawModal(); render(); };
A.cEnviar = () => {
  const d = cli.dados, tel = dig(d.tel);
  if (!S.loja.aberta) return toast("A loja está fechada no momento.", true);
  if (d.nome.trim().length < 2) return toast("Informe seu nome", true);
  if (tel.length < 10 || tel.length > 13) return toast("Informe um telefone com DDD", true);
  if (cli.canal === "delivery") { if (d.end.trim().length < 5) return toast("Informe o endereço de entrega", true); if (S.loja.bairros.length && !S.loja.bairros.some(b => b.nome === d.bairro)) return toast("Escolha o bairro da entrega", true); }
  if (S.online.filter(o => dig(o.cliente.tel) === tel && Date.now() - new Date(o.criado) < 6e5).length >= 3) return toast("Muitos pedidos seguidos. Fale com a loja pelo WhatsApp.", true);
  // o preço é refeito a partir do cardápio (o carrinho só guarda as escolhas)
  const itens = []; for (const c of cli.cart) { const r = montarItem(prodDe(c.pid) || { out: true, nome: c.nome }, c.sIds, c.cIds, c.qtd, c.obs); if (r.erro) return toast(r.erro, true); itens.push(r.item); }
  const sub = r2(itens.reduce((s, i) => s + itemTotal(i), 0)), taxa = cTaxa();

  const hist = S.pedidos.filter(p => p.numero && p.sit !== "aberto" && new Date(p.pagoEm || p.criado) >= de && new Date(p.pagoEm || p.criado) < ate).sort((a, b) => b.numero - a.numero);

/* =====================================================================
   ESTOQUE + FICHA TÉCNICA
   ===================================================================== */
const insumoDe = id => S.insumos.find(i => i.id === id);
const custoRec = key => r2((S.receitas[key] || []).reduce((t, l) => t + l.q * (insumoDe(l.i)?.custo || 0), 0) * 1e4) / 1e4;
function consumo(p) {
  const m = {}, add = (key, mult) => (S.receitas[key] || []).forEach(l => m[l.i] = (m[l.i] || 0) + l.q * mult);
  p.itens.forEach(i => { add("p:" + i.pid, i.pesoG != null ? i.pesoG : i.qtd); (i.sIds || []).forEach(id => add("s:" + id, i.qtd)); (i.cIds || []).forEach(id => add("c:" + id, i.qtd)); });
  if (["delivery", "retirada", "mkt"].includes(p.canal)) add("canal", 1);
  return m;
}
/** dá baixa nos insumos uma única vez por pedido e guarda o custo (CMV) */
function baixar(p) {
  if (p.baixa) return; const m = consumo(p); p.baixa = Object.entries(m).map(([i, q]) => ({ i, q })); let cmv = 0, baixos = [];
  p.baixa.forEach(b => { const x = insumoDe(b.i); if (!x) return; cmv += b.q * x.custo; const antes = x.estoque; x.estoque = r2(x.estoque - b.q); if (antes > x.min && x.estoque <= x.min) baixos.push(x.nome); });
  p.cmv = r2(cmv); if (baixos.length) toast("Estoque baixo: " + baixos.join(", "), true);
}
function devolver(p) { (p.baixa || []).forEach(b => { const x = insumoDe(b.i); if (x) x.estoque = r2(x.estoque + b.q); }); p.baixa = null; p.cmv = 0; }
const un = x => x.un === "un" ? "un" : x.un;
const fmtQ = (q, u) => `${Number(q).toLocaleString("pt-BR", { maximumFractionDigits: Math.abs(q) < 1 ? 4 : 1 })} ${u}`;

function tEstoque() {

  if (sub === "ficha") {
    const kinds = [["p", "Produtos", S.produtos], ["s", "Sabores (por bola)", S.sabores], ["c", "Complementos", S.grupos.flatMap(g => g.itens)]], k = ui.fk || "p", lista = kinds.find(x => x[0] === k)[2];
    const avgSab = S.sabores.length ? S.sabores.reduce((t, s) => t + custoRec("s:" + s.id), 0) / S.sabores.length : 0;
    return `<div class="col">${abas}<div class="tabs">${kinds.map(([kk, r]) => `<button class="tab" aria-pressed="${k === kk}" data-a="fichaK:${kk}">${r}</button>`).join("")}</div>

      return `<div class="row wrap" style="padding:8px 12px;border-top:1px solid var(--line)"><b class="sp">${esc(x.nome)}</b><span class="mut xs">${(S.receitas[key] || []).map(l => `${fmtQ(l.q, insumoDe(l.i)?.un || "")} ${esc(insumoDe(l.i)?.nome || "?")}`).join(" · ") || "sem ficha"}</span><span class="num sm">${k === "p" ? "custo " : ""}${brl(est)}${peso ? "/kg" : ""}</span>${marg != null ? `<span class="chip ${marg < 40 ? "bad" : "ok"}">${marg.toFixed(0)}% margem</span>` : ""}<button class="btn sm" data-a="ficha:${key}">Editar</button></div>`; }).join("")}</div></div>`;
  }
  return `<div class="col">${abas}${baixos.length ? `<div class="chip warn" style="padding:8px;border-radius:12px">⚠ Estoque baixo: ${baixos.map(b => esc(b.nome)).join(", ")}</div>` : ""}
  <div class="row"><span class="sp"></span><button class="btn pri sm" data-a="novoInsumo">＋ Insumo</button></div>
  <div class="card"><table><tr><th>Insumo</th><th class="num">Saldo</th><th class="num">Mínimo</th><th class="num">Custo/un</th><th></th></tr>${S.insumos.map(i => `<tr><td><b>${esc(i.nome)}</b> ${i.estoque <= i.min ? '<span class="chip bad">baixo</span>' : ""}</td><td class="num">${fmtQ(i.estoque, i.un)}</td><td class="num mut">${fmtQ(i.min, i.un)}</td><td class="num">${brl(i.custo)}</td><td><button class="btn sm" data-a="entrada:${i.id}">＋ Entrada</button> <button class="btn ghost sm" data-a="ajuste:${i.id}">Ajuste</button></td></tr>`).join("")}</table></div></div>`;
}

    const f = ui.cf || "pagar", l = S.contas.filter(c => c.tipo === f).sort((a, b) => (a.venc > b.venc ? 1 : -1)), aberto = r2(l.filter(c => !c.pago).reduce((t, c) => t + c.valor, 0));
    return `<div class="col">${abas}<div class="row wrap"><div class="tabs sp">${[["pagar", "A pagar"], ["receber", "A receber"]].map(([k, r]) => `<button class="tab" aria-pressed="${f === k}" data-a="cfil:${k}">${r}</button>`).join("")}</div><span class="num sm">Em aberto: <b>${brl(aberto)}</b></span><button class="btn pri sm" data-a="novaConta">＋ Conta</button></div>
    <div class="card">${l.map(c => { const venc = !c.pago && c.venc < hojeISO(); return `<div class="row wrap" style="padding:10px 12px;border-top:1px solid var(--line)"><div class="sp"><b>${esc(c.desc)}</b><div class="mut xs">${esc(c.cat || "")} · vence ${dataBR(c.venc)}</div></div><b class="num">${brl(c.valor)}</b>${c.pago ? `<span class="chip ok">${f === "pagar" ? "pago" : "recebido"} ${c.pagoEm ? new Date(c.pagoEm).toLocaleDateString("pt-BR") : ""}</span>` : `${venc ? '<span class="chip bad">vencida</span>' : ""}<button class="btn sm" data-a="baixar:${c.id}">${f === "pagar" ? "Pagar" : "Receber"}</button>`}<button class="btn ghost sm" aria-label="Excluir" data-a="delConta:${c.id}">🗑</button></div>`; }).join("") || '<p class="mut" style="padding:18px;text-align:center">Nenhuma conta.</p>'}</div></div>`;
  }
  if (sub === "fluxo") {
    const por = {}; vend.forEach(p => p.pags.forEach(x => por[x.meio] = r2((por[x.meio] || 0) + x.valor))); const entradas = r2(Object.values(por).reduce((t, v) => t + v, 0));
    const pagas = S.contas.filter(c => c.pago && c.tipo === "pagar" && no(c.pagoEm)), saidas = r2(pagas.reduce((t, c) => t + c.valor, 0)), recebidas = r2(S.contas.filter(c => c.pago && c.tipo === "receber" && no(c.pagoEm)).reduce((t, c) => t + c.valor, 0));
    const prox = S.contas.filter(c => !c.pago && c.venc <= new Date(Date.now() + 7 * 864e5).toISOString().slice(0, 10)).sort((a, b) => (a.venc > b.venc ? 1 : -1));
    return `<div class="col">${abas}${perAbas}<div class="stats num"><div class="card stat"><span class="mut xs">Entradas (vendas)</span><b style="color:var(--ok)">${brl(entradas)}</b></div><div class="card stat"><span class="mut xs">Outras entradas</span><b>${brl(recebidas)}</b></div><div class="card stat"><span class="mut xs">Saídas pagas</span><b style="color:var(--bad)">${brl(saidas)}</b></div><div class="card stat"><span class="mut xs">Saldo do período</span><b>${brl(entradas + recebidas - saidas)}</b></div></div>
    <div class="card num sm" style="padding:14px"><h3 style="font-size:14px;margin-bottom:6px">Entradas por forma</h3>${Object.entries(por).map(([k, v]) => `<div class="row"><span class="sp">${MEIOS[k]}</span><b>${brl(v)}</b></div>`).join("") || '<span class="mut">Sem vendas.</span>'}</div>
    <div class="card" style="padding:14px"><h3 style="font-size:14px;margin-bottom:6px">Vencendo em até 7 dias (e atrasadas)</h3>${prox.map(c => `<div class="row sm"><span class="sp">${esc(c.desc)} <span class="mut">· ${dataBR(c.venc)}</span></span><b class="num" style="color:${c.tipo === "pagar" ? "var(--bad)" : "var(--ok)"}">${c.tipo === "pagar" ? "−" : "+"} ${brl(c.valor)}</b></div>`).join("") || '<span class="mut sm">Nada vencendo.</span>'}</div></div>`;
  }
  const com = r2(vend.filter(p => p.canal === "mkt").reduce((t, p) => t + totalPedido(p), 0) * S.loja.comMkt / 100), cmv = r2(vend.reduce((t, p) => t + (p.cmv || 0), 0)), bruta = r2(bruto - com - cmv);
  const desp = S.contas.filter(c => c.pago && c.tipo === "pagar" && c.cat !== "Estoque" && no(c.pagoEm)), dTot = r2(desp.reduce((t, c) => t + c.valor, 0)), porCat = {}; desp.forEach(c => porCat[c.cat || "Outras"] = r2((porCat[c.cat || "Outras"] || 0) + c.valor));
  const linha = (r, v, o = {}) => `<div class="row" style="padding:7px 0;border-top:1px solid var(--line);${o.b ? "font-weight:800;font-size:16px" : ""}"><span class="sp" style="padding-left:${o.i ? 16 : 0}px;${o.m ? "color:var(--mut)" : ""}">${r}</span><span class="num" style="color:${o.neg ? "var(--bad)" : "inherit"}">${o.neg && v ? "− " : ""}${brl(v)}</span></div>`;
  return `<div class="col">${abas}${perAbas}<div class="card" style="padding:16px;max-width:640px">${linha("Vendas (receita bruta, já com descontos)", bruto, { b: 1 })}${linha(`Comissão marketplace (${S.loja.comMkt}%)`, com, { neg: 1, i: 1 })}${linha("CMV — custo dos insumos vendidos", cmv, { neg: 1, i: 1 })}${linha("Lucro bruto", bruta, { b: 1 })}${Object.entries(porCat).map(([k, v]) => linha(esc(k), v, { neg: 1, i: 1, m: 1 })).join("")}${linha("Despesas pagas", dTot, { neg: 1 })}${linha("Resultado do período", r2(bruta - dTot), { b: 1 })}<p class="mut xs" style="margin-top:8px">Margem bruta ${bruto ? (bruta / bruto * 100).toFixed(1) : 0}% · compras de estoque não entram como despesa (entram pelo CMV quando vendidas).</p></div></div>`;
}
A.finSub = (el, k) => { ui.fin = k; render(); }; A.fper = (el, k) => { ui.fper = k; render(); }; A.cfil = (el, k) => { ui.cf = k; render(); };
A.novaConta = () => openModal("Nova conta", () => `<div class="col"><div class="g2">${field("Tipo", `<select id="ct-t"><option value="pagar">A pagar</option><option value="receber">A receber</option></select>`)}${field("Categoria", `<input id="ct-c" list="cats" placeholder="Aluguel, Energia…"><datalist id="cats"><option>Aluguel</option><option>Energia</option><option>Água</option><option>Salários</option><option>Marketing</option><option>Manutenção</option><option>Impostos</option></datalist>`)}</div>${field("Descrição", `<input id="ct-d" autofocus>`)}<div class="g2">${field("Valor (R$)", `<input id="ct-v" inputmode="decimal">`)}${field("Vencimento", `<input type="date" id="ct-w" value="${hojeISO()}">`)}</div><button class="btn pri" data-a="novaContaOk">Salvar</button></div>`, true);
A.novaContaOk = () => { const d = $("#ct-d").value.trim(), v = num($("#ct-v").value); if (!d || !v) return toast("Informe a descrição e o valor.", true); S.contas.push({ id: uid(), tipo: $("#ct-t").value, desc: d, valor: r2(v), venc: $("#ct-w").value || hojeISO(), pago: false, cat: $("#ct-c").value.trim() }); ui.cf = $("#ct-t").value; closeModal(); commit(); };
A.baixar = (el, id) => { const c = S.contas.find(x => x.id === id); c.pago = true; c.pagoEm = new Date().toISOString(); commit(); };
A.delConta = (el, id) => { if (confirm("Excluir esta conta?")) { S.contas = S.contas.filter(c => c.id !== id); commit(); } };

/* =====================================================================
   GARÇOM (comanda eletrônica no celular) · TOTEM · PAINEL DE SENHAS
   ===================================================================== */
function vGarcom() {
  const L = S.loja, p = ativo(), mesa = p?.canal === "mesa" ? p.mesa : null, q = ui.busca.trim().toLowerCase();
  const head = `<div class="top"><div class="row"><a class="btn ghost sm" href="#/">←</a><h1>🍽 Garçom</h1><span class="sp"></span>${mesa ? `<span class="chip ok">Comanda ${esc(mesa)}</span>` : ""}</div></div>`;
  if (!mesa) { const ab = S.pedidos.filter(x => x.sit === "aberto" && x.canal === "mesa" && x.itens.length);
    return head + `<div class="wrapper"><p class="mut sm">Escolha a comanda da mesa.${caixaAberto() ? "" : ' <b style="color:var(--bad)">Caixa fechado: peça para abrir no PDV.</b>'}</p><div class="grid" style="grid-template-columns:repeat(auto-fill,minmax(90px,1fr))">${Array.from({ length: L.comandas }, (_, k) => String(k + 1)).map(n => { const o = ab.find(x => x.mesa === n); return `<button class="tile big" style="min-height:90px;align-items:center;justify-content:center;${o ? "background:var(--cream);border:2px solid #f59e0b" : ""}" data-a="gMesa:${n}"><b style="font-size:26px">${n}</b>${o ? `<span class="xs num">${brl(totalPedido(o))}</span>` : '<span class="xs mut">livre</span>'}</button>`; }).join("")}</div></div>`; }
  const prods = S.produtos.filter(x => x.ativo && (!ui.cat || x.cat === ui.cat) && (!q || x.nome.toLowerCase().includes(q))), novos = p.itens.some(i => !p.enviados.includes(i.id));
  return head + `<div class="wrapper col" style="padding-bottom:90px"><input type="search" placeholder="Buscar produto" data-i="busca" data-keep="busca" value="${esc(ui.busca)}"><div class="tabs">${[{ id: "", nome: "Todos", em: "✨" }, ...S.cats].map(c => `<button class="tab" aria-pressed="${ui.cat === c.id}" data-a="pCat:${c.id}">${c.em} ${esc(c.nome)}</button>`).join("")}</div>
  <div class="grid">${prods.map(x => `<button class="tile" ${x.out ? "disabled" : ""} data-a="pProd:${x.id}"><span class="em">${catEm(x.cat)}</span><span><b>${esc(x.nome)}</b><br><span class="mut sm num">${x.out ? "Em falta" : brl(x.preco)}</span></span></button>`).join("")}</div>
  <div class="card" style="padding:12px"><h3 style="font-size:14px;margin-bottom:6px">Comanda ${esc(mesa)} · ${brl(totalPedido(p))}</h3>${p.itens.map(i => `<div class="row sm" style="padding:4px 0"><span class="sp">${i.pesoG != null ? i.pesoG + " g " : i.qtd + "× "}${esc(i.nome)} <span class="mut xs">${esc([i.sabores.join(", "), i.comps.map(c => c.nome).join(", ")].filter(Boolean).join(" · "))}</span>${p.enviados.includes(i.id) ? ' <span class="chip xs">enviado</span>' : ""}</span><button class="btn ghost sm" aria-label="Remover ${esc(i.nome)}" data-a="${p.enviados.includes(i.id) ? "gBloq" : "vDel:" + i.id}">🗑</button></div>`).join("") || '<span class="mut sm">Sem itens.</span>'}</div></div>
  <div class="bar"><div class="row"><button class="btn" data-a="gVoltar">← Comandas</button><button class="btn" ${p.pediuConta ? "disabled" : ""} data-a="gConta">🧾 ${p.pediuConta ? "Conta pedida" : "Pedir conta"}</button><button class="btn pri sp" ${novos ? "" : "disabled"} data-a="gLancar">Lançar na cozinha</button></div></div>`;
}
A.gMesa = (el, n) => { if (!caixaAberto()) return toast("Caixa fechado: peça para abrir no PDV.", true); AT.id = null; const ex = S.pedidos.find(x => x.sit === "aberto" && x.canal === "mesa" && x.mesa === n && x.itens.length); if (ex) AT.id = ex.id; else { const p = garantir(); p.canal = "mesa"; p.mesa = n; } commit(); };
A.gVoltar = () => { const p = ativo(); if (p && !p.itens.length) S.pedidos = S.pedidos.filter(x => x.id !== p.id); AT.id = null; commit(); };
A.gBloq = () => toast("Item já enviado: peça ao caixa para cancelar.", true);
A.gLancar = () => { const p = ativo(); paraProducao(p); toast(`Comanda ${p.mesa} enviada para a cozinha.`); AT.id = null; commit(); };
A.gConta = () => { const p = ativo(); p.pediuConta = true; toast("Conta pedida ao caixa."); commit(); };

const tot = { cart: [], senha: null, cat: "" };
function vTotem() {
  if (tot.senha) return `<div class="hero"><div class="col" style="text-align:center;max-width:520px"><div style="font-size:64px">🎉</div><h1 style="font-size:30px">Pedido registrado!</h1><div class="mut">Sua senha</div><div style="font-size:120px;font-weight:800;line-height:1;color:var(--pri)">${tot.senha}</div><p style="font-size:20px">Pague no caixa informando a senha.<br>Chamaremos quando estiver pronto.</p></div></div>`;
  const prods = S.produtos.filter(p => p.ativo && p.tipo === "un" && (!tot.cat || p.cat === tot.cat)), sub = r2(tot.cart.reduce((s, i) => s + itemTotal(i), 0)), q = tot.cart.reduce((s, i) => s + i.qtd, 0);
  return `<div class="tot"><div class="row" style="margin-bottom:12px"><a class="btn ghost sm" href="#/">←</a><h1 style="font-size:28px">🍨 ${esc(S.loja.nome)}</h1><span class="sp"></span><span class="mut">Toque para pedir</span></div><div class="tabs" style="margin-bottom:12px">${[{ id: "", nome: "Tudo", em: "✨" }, ...S.cats].map(c => `<button class="tab" style="font-size:18px;padding:12px 20px" aria-pressed="${tot.cat === c.id}" data-a="tCat:${c.id}">${c.em} ${esc(c.nome)}</button>`).join("")}</div>
  <div class="grid" style="grid-template-columns:repeat(auto-fill,minmax(200px,1fr))">${prods.map(p => `<button class="tile big" style="min-height:150px" ${p.out ? "disabled" : ""} data-a="tProd:${p.id}"><span style="font-size:46px">${catEm(p.cat)}</span><span><b style="font-size:19px">${esc(p.nome)}</b><br><span class="num" style="font-size:18px">${p.out ? "Em falta" : brl(p.preco)}</span></span></button>`).join("")}</div>
  ${q ? `<div class="bar"><div class="row" style="max-width:900px;margin:0 auto"><div class="sp"><b>${q} ${q === 1 ? "item" : "itens"}</b> <span class="num" style="font-size:22px;font-weight:800">${brl(sub)}</span></div><button class="btn big" data-a="tLimpar">Limpar</button><button class="btn pri big" data-a="tFinalizar">Finalizar pedido</button></div></div>` : ""}</div>`;
}
A.tCat = (el, id) => { tot.cat = id; render(); }; A.tLimpar = () => { tot.cart = []; render(); };
A.tProd = (el, id) => { const p = prodDe(id); if (p.sab || p.grupos.length) return abrirMontar(p, "tot"); tot.cart.push({ id: uid(), pid: p.id, nome: p.nome, qtd: 1, unit: p.preco, sabores: [], comps: [], sIds: [], cIds: [] }); render(); };
A.tFinalizar = () => { if (!caixaAberto()) return toast("Caixa fechado. Chame um atendente.", true); const p = novoPedido("balcao"); p.itens = tot.cart; p.totem = true; numerar(p); S.pedidos.push(p); tot.cart = []; tot.senha = p.numero; save(); render(); setTimeout(() => { tot.senha = null; render(); }, 9000); };

function vPainel() {
  const L = S.pedidos.filter(p => p.sit !== "cancelado" && p.canal !== "delivery" && p.numero), prep = L.filter(p => ["novo", "preparando"].includes(p.prod)), pronto = L.filter(p => p.prod === "pronto");
  return `<div class="tv"><div class="row"><h1 style="font-size:30px">🍨 ${esc(S.loja.nome)}</h1><span class="sp"></span><a class="btn ghost sm" style="color:#fff" href="#/">sair</a></div><div class="g2" style="margin-top:20px"><section><h2 style="color:#fbbf24">Preparando</h2>${prep.map(p => `<span class="senha">${p.numero}</span>`).join("") || '<p style="opacity:.5;font-size:22px">—</p>'}</section><section class="pronto"><h2 style="color:#6ee7b7">Pronto! Retire no balcão</h2>${pronto.map(p => `<span class="senha">${p.numero}</span>`).join("") || '<p style="opacity:.5;font-size:22px">—</p>'}</section></div></div>`;
}

A.imprimirCoz = (el, id) => {
  const p = S.pedidos.find(x => x.id === id), html = `<!doctype html><meta charset="utf-8"><style>@page{size:80mm auto;margin:0}body{width:72mm;margin:4mm;font:14px/1.4 "Courier New",monospace}.c{text-align:center}hr{border:0;border-top:1px dashed #000}li{margin-bottom:6px}</style><div class="c"><b style="font-size:22px">#${p.numero}</b><br><b>${CANAIS[p.canal]}${p.mesa ? " " + esc(p.mesa) : ""}${p.origem ? " · " + esc(p.origem) : ""}</b><br>${new Date().toLocaleTimeString("pt-BR", { hour: "2-digit", minute: "2-digit" })}</div><hr><ul style="padding:0;list-style:none">${p.itens.map(i => `<li><b>${i.pesoG != null ? esc(i.nome) + " " + i.pesoG + "g" : i.qtd + "x " + esc(i.nome)}</b>${i.sabores.length ? "<br>" + esc(i.sabores.join(", ")) : ""}${i.comps.length ? "<br>+ " + esc(i.comps.map(c => c.nome).join(", ")) : ""}${i.obs ? "<br><b>OBS: " + esc(i.obs) + "</b>" : ""}</li>`).join("")}</ul>${p.obs ? `<hr><b>${esc(p.obs)}</b>` : ""}`;
  const q = document.createElement("iframe"); q.style.cssText = "position:fixed;right:0;bottom:0;width:1px;height:1px;border:0;opacity:0"; document.body.appendChild(q); q.contentDocument.open(); q.contentDocument.write(html); q.contentDocument.close(); setTimeout(() => { try { q.contentWindow.print(); } finally { setTimeout(() => q.remove(), 6e4); } }, 150);
};
setInterval(() => { if (!$("#modal").children.length && !document.activeElement?.matches("input,select,textarea") && (rota() === "pdv" && ["producao", "comandas"].includes(ui.tab) || rota() === "cardapio" && cli.cod || rota() === "painel")) render(); }, 5000);
render();
</script>
</body>
</html>
